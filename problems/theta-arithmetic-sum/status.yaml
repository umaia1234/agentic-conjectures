notes: >-
  Partial result only: Conjectures 1.1 and 4.1-4.4 of the paper and the lower inequality of Conjecture 3.3
  are not proved. The bound |S(k)|<6k(1+ln k)^2+8k (Theorem 7.1 of DETAILS.md), which settles the upper
  inequality of Conjecture 3.3, is a pen-and-paper proof and is not machine-checked: one independent review
  by a separate AI session re-derived every step and found no gap, and CI re-checks only the numerics
  (verify.py checks each claim of the proof for every prime k<=400, and the bound, which holds there with at
  least 40-fold slack, on every table row). Lean states Conjecture 3.3 and its two inequalities
  (statement_3_3, statement_3_3_lower, statement_3_3_upper; not upstream, formalized from the text of v3)
  and proves only that the conjecture is their conjunction and that the lower one is equivalent to
  Conjecture 4.4. Lean also covers the exact reductions of the upstream definition, the reciprocity law
  (Proposition 4.1), the exact formula (Theorem 4.3) with the resulting reformulation of Conjecture 1.1,
  and a kernel check of Conjectures 1.1, 4.1 and 4.2 for odd primes k<300; the Dedekind-sum forms, the
  error-term and divisor identities and the character form are pen-and-paper proofs, checked by verify.py
  on small ranges but not formalized. Several ingredients are classical: the Dedekind form follows from
  Sitaramachandrarao's formula, the reciprocity law is of Berndt-Goldberg type and the character form
  follows from Zhang (2003, Lemma 5); see DETAILS.md. verify.py needs g++ and Python with mpmath (which
  comes with sympy, as in CI). The table to 2·10^6 comes from two
  programs using different decompositions and different Dedekind-sum evaluations, plus the literal definition
  to 30000. No novelty is claimed; nothing has been reported upstream or to the authors. The upstream research
  declarations remain sorry-backed.
