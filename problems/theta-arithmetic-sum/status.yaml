id: theta-arithmetic-sum
title: 'Theta arithmetic sum S(k) (arXiv:2501.03234) — exact formula, upper bound and check to 2·10^6'
title_ko: '세타 산술합 S(k) (arXiv:2501.03234) — 정확한 공식, 상계, 2·10^6까지의 검증'
domain: other
source_url: https://arxiv.org/abs/2501.03234
claimed_status: partial
claim: >-
  Pen-and-paper proof, not machine-checked (reviewed independently by a separate AI session; CI
  re-checks only the numerics): |S(k)|<6k(1+ln k)^2+8k for every odd prime k, which settles the
  upper inequality of Conjecture 3.3 (arXiv v2/v3). Lean-checked: the exact formula
  S(k)=kH(k)-(k-1)/2+2V(k) for odd primes k (V a sum of Hardy sums), hence that Conjecture 1.1 is
  equivalent to 2V(k)>(k-1)/2-kH(k), and Conjectures 1.1, 4.1 and 4.2 for every odd prime k<300.
  Two independent O(k log k) programs find no violation of Conjectures 1.1 and 4.1-4.3 for odd
  primes k<=2·10^6; Conjectures 1.1 and 4.1-4.4 remain open.
claim_ko: >-
  기계 검증되지 않은 손 증명(별도의 AI 세션이 독립적으로 검토했고, CI는 수치만 다시 검사함):
  모든 홀수 소수 k에 대해 |S(k)|<6k(1+ln k)^2+8k이며, 이로써 추측 3.3(arXiv v2/v3)의 위쪽
  부등식이 해결된다. Lean 검증: 홀수 소수 k에 대한 정확한 공식 S(k)=kH(k)-(k-1)/2+2V(k)(V는
  Hardy 합의 합), 이로부터 따르는 추측 1.1과 2V(k)>(k-1)/2-kH(k)의 동치, 그리고 k<300인 모든
  홀수 소수에 대한 추측 1.1, 4.1, 4.2. 서로 독립적인 두 O(k log k) 프로그램은 k<=2·10^6인 홀수
  소수에서 추측 1.1, 4.1-4.3의 위반을 찾지 못했으며, 추측 1.1과 4.1-4.4는 여전히 미해결이다.
