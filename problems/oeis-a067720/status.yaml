claim: Proves that if k+1=p^a with a>=2 then there is no solution for p=2, and for odd p with V=v2(p^a-1)+v2(p-1)<=5
  the only solution is (p,a,k)=(3,2,8); general composite k+1 and the V>=6 prime-power cases remain open,
  so the original question is unresolved.
