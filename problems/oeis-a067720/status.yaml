notes: The power-of-two exclusion and the odd-prime V<=6 classification, which contains the V<=5 theorem
  of PROOF.md, are kernel-checked against the exact upstream equation, with V written via padicValNat. The
  V=6 step (three prime factors of k^2+1 would all be 5 mod 8, while V>=6 forces 8 to divide k) is not in
  PROOF.md; it is explained in the README and checked in Lean. The Lean proof peels off least prime factors
  instead of counting the prime factors of k^2+1. Nothing here covers general composite k+1 or odd prime
  powers with V>=7 whose k^2+1 has at least three prime factors; b-file length is not treated as a
  verified range; novelty is not asserted before peer review; the upstream universal Lean statement
  remains sorry-backed.
