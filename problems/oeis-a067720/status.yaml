id: oeis-a067720
title: OEIS A067720 — phi(k^2+1)=k*phi(k+1) prime-power subfamily
title_ko: OEIS A067720 — phi(k^2+1)=k*phi(k+1)의 소수 거듭제곱 부분족
domain: oeis
source_url: https://oeis.org/A067720
claimed_status: partial
claim: Lean-verifies that for k+1=p^a with p prime and a>=2 there is no solution when p=2, and that
  for odd p with V=v2(p^a-1)+v2(p-1)<=6, or with k^2+1 a product of two primes, the only solution is
  (p,a,k)=(3,2,8); general composite k+1 and odd prime powers with V>=7 whose k^2+1 has at least three
  prime factors remain open.
claim_ko: >-
  p가 소수이고 a>=2인 k+1=p^a에 대해, p=2이면 해가 없고, p가 홀수이며
  V=v2(p^a-1)+v2(p-1)<=6이거나 k^2+1이 두 소수의 곱이면 해는 (p,a,k)=(3,2,8)뿐임을 Lean으로
  검증했으나, 일반적인 합성수 k+1과 V>=7이면서 k^2+1의 소인수가 세 개 이상인 홀수 소수 거듭제곱
  경우는 여전히 미해결이다.
