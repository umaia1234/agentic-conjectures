id: oeis-a067720
title: OEIS A067720 — phi(k^2+1)=k*phi(k+1) prime-power subfamily
title_ko: OEIS A067720 — phi(k^2+1)=k*phi(k+1)의 소수 거듭제곱 부분족
domain: oeis
source_url: https://oeis.org/A067720
claimed_status: partial
claim: Lean-verifies that no solution has k+1=2^a with a>=2, and that for an odd prime p with
  V=v2(p^a-1)+v2(p-1)<=5 the equation holds if and only if (p,a,k)=(3,2,8); general composite k+1
  and the V>=6 prime-power cases remain open.
claim_ko: >-
  k+1=2^a이고 a>=2인 해가 없음을 Lean으로 검증했고, 홀수 소수 p에 대해
  V=v2(p^a-1)+v2(p-1)<=5이면 방정식이 성립할 필요충분조건이 (p,a,k)=(3,2,8)임을 Lean으로
  검증했으나, 일반적인 합성수 k+1과 V>=6인 소수 거듭제곱 경우는 여전히 미해결이다.
