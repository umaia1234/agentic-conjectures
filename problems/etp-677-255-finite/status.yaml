notes: >-
  Partial result only; the problem stays open and no novelty is claimed. Countermodels up to size 11 were
  already excluded by uncertified Mace4 and DPLL searches reported in the ETP Zulip thread, and
  translation-invariant countermodels over all groups of order <= 26 by explicit-group searches and
  over Z/n for n <= 37 by the eq677 database search; the additions here are DRAT certificates for
  n <= 10 and the seven non-cyclic groups of orders 27 and 28. An n = 11 DFS was stopped with 3 of its 27
  subtrees unfinished and is not claimed. CI re-checks the DRAT proofs for n <= 8 and the DFS for n <= 9;
  the n = 9, 10 proofs (12.7 MB and 631 MB) are regenerated locally, the n = 10 DFS run and the group
  search are local-only and uncertified.
  The DRAT results trust gen_cnf.py and the encoding argument in DETAILS.md, whose finite-magma facts are
  Lean-checked.
