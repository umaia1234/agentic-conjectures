id: etp-677-255-finite
title: 'ETP Problem 8.1 — Equation 677 vs 255 in finite magmas: no countermodel up to size 10'
title_ko: 'ETP 문제 8.1 — 유한 마그마의 등식 677과 255: 크기 10까지 반례 모델 없음'
domain: other
source_url: https://arxiv.org/abs/2512.07087
claimed_status: partial
claim: >-
  Does not resolve whether Equation 677 implies Equation 255 in every finite magma. Shows that no
  countermodel has at most 10 elements (DRAT-certified via a Lean-justified reduction to one-generated
  canonical tables, and independently by an uncertified exhaustive DFS), and that no
  translation-invariant countermodel x*y = x f(x^-1 y) exists over any group of order at most 29
  (SAT with automorphism symmetry breaking, uncertified).
claim_ko: >-
  유한 마그마에서 등식 677이 등식 255를 함의하는지는 해결하지 못한다. 원소가 10개 이하인 반례 모델이
  없음을 (Lean으로 정당화한 한 원소 생성 표준 표로의 환원을 거쳐) DRAT로 인증하고 독립적인 전수
  DFS로도(인증서 없이) 확인하며, 위수 29 이하의 어떤 군 위에도 평행이동 불변 반례 모델
  x*y = x f(x^-1 y)가 없음을 자기동형 대칭 깨기를 쓴 SAT로(인증서 없이) 보인다.
