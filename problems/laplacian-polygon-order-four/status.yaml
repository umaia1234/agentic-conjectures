id: laplacian-polygon-order-four
title: Order-four polygon question for standardized Laplacians
title_ko: 표준화 라플라시안의 4차 다각형 질문
domain: graph-combinatorics
source_url: https://arxiv.org/abs/2610.14100v2
claimed_status: partial
claim: >-
  Proves in Lean (statement_iff_faceBounds, z4_statement_iff_faceBound) that Question 1 (Λ₄ = S₄)
  is equivalent to two polynomial inequalities on the faces of the weight cube with at most four
  fractional weights, at most two per row, and its form z(4) = 1/4 to the first; an exact
  Bernstein certificate outside Lean verifies both inequalities, so Λ₄ = S₄ is claimed only as a
  computer-assisted result.
claim_ko: >-
  질문 1(Λ₄ = S₄)이, 분수 가중치가 네 개 이하이고 행마다 두 개 이하인 가중치 큐브의 면 위에서
  성립하는 두 다항식 부등식과 동치이고, 그 동치 형태 z(4) = 1/4는 첫 번째 부등식과 동치임을
  Lean으로 증명했다(statement_iff_faceBounds, z4_statement_iff_faceBound). 두 부등식은 Lean 밖의
  정확한 Bernstein 인증서로 검증하므로, Λ₄ = S₄는 컴퓨터 보조 결과로만 주장한다.
