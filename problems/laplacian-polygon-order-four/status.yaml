notes: >-
  Partial result: Lean proves only the equivalences, and FaceBound and SectorFaceBound appear there
  as hypotheses. The two inequalities are verified by face_certificate.py alone (Python standard
  library, exact integers and fractions, deterministic, compared with face_orbits.tsv); its trusted
  base is the Python interpreter and the script's own polynomial code, which it cross-checks at random
  rational points against a separate evaluation of the Lean formulas. numerical_check.py is a
  floating-point check that shares no code with it. A Zenodo preprint by Dylan Z. Liu (2026-10-25,
  not refereed) reports a computer-assisted proof of Λ₄ = S₄ by a related Bernstein method; its
  script was not on the record and was not run. Chebotarev's arXiv paper is AI-assisted by its own
  declaration; every fact used here is re-derived. No novelty is claimed, no human has reviewed this
  work, and nothing has been reported to the authors or submitted anywhere.
