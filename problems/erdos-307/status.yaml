verify:
- cmd: python3 test_identities.py
  expected_runtime: unknown
  ci_feasible: true
- cmd: python3 exact_checker.py --P 2,5,11 --Q 3,7,13
  expected_runtime: unknown
  ci_feasible: true
- cmd: python3 enumerate_59.py
  expected_runtime: unknown
  ci_feasible: false
- cmd: python3 enumerate_bounded_support_fast.py --prime-count 68
  expected_runtime: unknown (checks 9,926,250 unions)
  ci_feasible: false
- cmd: python3 cross_check_support.py fiftynine
  expected_runtime: ~1 s (standard library only; second implementation of the 59-prime exclusion)
  ci_feasible: true
- cmd: mkdir -p build && g++ -O3 -std=c++17 -pthread support_mitm.cpp -o build/support_mitm && build/support_mitm 80 --threads 2
  expected_runtime: ~3 s plus compilation (excludes supports inside the first 80 primes)
  ci_feasible: true
  requires: [g++]
- cmd: mkdir -p build && g++ -O3 -std=c++17 -pthread support_mitm.cpp -o build/support_mitm && build/support_mitm 90 --key 33 --threads 3
  expected_runtime: 753 s wall with 3 threads on a heavily loaded 18-core machine (1,542 s CPU); peak memory 3.4 GB
  ci_feasible: false
  requires: [g++]
- cmd: python3 cross_check_support.py mitm --K 90 --key 33 --threads 3
  expected_runtime: 1,578 s wall with 3 threads under load (3,912 s CPU); peak memory 6.9 GB; needs numpy and numba
  ci_feasible: false
- cmd: python3 cross_check_support.py brute --K 76 --keys 12,16,20,24,30 --threads 3
  expected_runtime: 529 s with 3 threads; needs numpy and numba
  ci_feasible: false
