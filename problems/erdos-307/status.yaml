id: erdos-307
title: 'Erdős #307 — product of prime reciprocal sums equal to 1'
title_ko: 'Erdős #307 — 소수 역수합들의 곱이 1이 되는 문제'
domain: erdos
source_url: https://www.erdosproblems.com/307
claimed_status: partial
claim: >-
  Re-proves the forcing identities and local Legendre/mod-8/mod-24 necessary conditions, now Lean-checked
  together with |P union Q| >= 59, and exhaustively shows |P union Q| >= 60 and max(P union Q) >= 467 (no
  solution inside the first 90 primes, cross-checked by a second implementation); the problem itself
  remains open and no novelty is claimed.
claim_ko: >-
  강제 항등식과 국소 Legendre/mod-8/mod-24 필요조건을 다시 증명하고 |P union Q| >= 59와 함께 Lean으로
  검증하며, 완전탐색으로 |P union Q| >= 60 및 max(P union Q) >= 467(처음 90개 소수 안에는 해가 없음,
  두 번째 구현으로 교차검증)을 보인다. 문제 자체는 여전히 미해결이며 새로움을 주장하지 않는다.
