notes: >-
  README: 'The problem remains open; nothing here is presented as a solution or as a proof of novelty.'
  Forcing theorem already appears in Bado's 2026 preprint; AlphaProof Nexus lists attempts but no result
  for #307; the |U|>=60 bound matches the existing database statement; upstream Lean declaration is
  sorry-backed. The max(P union Q)>=467 exclusion is computational: support_mitm.cpp and the separately
  written cross_check_support.py share the reduction and the meet-in-the-middle design (their key-matched
  counts and histograms agree at K=84 and K=90), and the keyless brute-force mode agrees with the C++
  program for every even K through 76. It relies on the 59-prime enumeration for |U|>=60. The Lean module
  proves the necessary conditions, not the enumerations; its 59 bound uses decide +kernel, not native_decide.
