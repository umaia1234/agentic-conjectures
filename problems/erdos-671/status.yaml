id: erdos-671
title: "Erdős #671 — everywhere-unbounded Lagrange arrays proved"
title_ko: "에르되시 #671 — 모든 점에서 비유계인 라그랑주 배열 증명"
domain: erdos
source_url: https://www.erdosproblems.com/671
claimed_status: proved
claim: >-
  Lean-proves both questions in Erdős #671: there is one exact-cardinality
  triangular interpolation array whose Lebesgue functions are cofinally
  unbounded at every point of [-1,1], while every continuous function has a
  point where the full sequence of Lagrange interpolants converges to it.
claim_ko: >-
  에르되시 #671의 두 질문을 모두 Lean으로 증명한다. 정확한 개수의 절점을 갖는
  하나의 삼각 보간 배열이 존재하여 그 르베그 함수들은 [-1,1]의 모든 점에서
  공종적으로 비유계이지만, 모든 연속함수에는 라그랑주 보간 다항식의 전체 열이
  그 함수로 수렴하는 점이 있다.
artifacts:
  - path: DETAILS.md
    kind: mathematical-details
  - path: upstream/README.md
    kind: upstream-source
  - path: upstream/Erdos671.public.lean
    kind: upstream-lean
  - path: upstream/SHA256SUMS
    kind: checksum
verify:
  - cmd: cd upstream && sha256sum -c SHA256SUMS
    expected_runtime: "<1s"
    ci_feasible: true
lean:
  modules:
    - AgenticConjectures.Erdos671
  theorems:
    - AgenticConjectures.Erdos671.erdos_671
attribution:
  - model: GPT Pro
    harness: unspecified
    scope: original proof argument, as attributed by the public source
  - model: Codex
    harness: unspecified
    scope: original Lean formalization, as attributed by the public source
  - model: GPT-5.6 Sol
    harness: Codex Desktop
    scope: independent reproduction, statement audit, repository integration, and documentation
notes: >-
  The canonical page still displayed OPEN and a $250 prize on 2026-08-12, but
  the complete proof and Lean source had already been posted publicly on its
  discussion thread on 2026-06-22; this repository claims no novelty or prize,
  does not submit the result externally, and preserves the public attribution
  exactly as disclosed (no exact model/harness was named); the stronger second
  question implies the first, and the theorem uses only propext,
  Classical.choice, and Quot.sound.
