attribution:
- model: GPT-5.6 Sol
  harness: Codex Desktop
  scope: original research artifacts (proofs, certificates, searches, surveys)
- model: GPT-5.6 Sol
  harness: Codex Desktop
  scope: Lean 4 odd-index and baseline theorems; independent billion-range certificate and documentation
- model: Claude Opus 5.5 (max effort)
  harness: Claude Code
  scope: >-
    two independent multithreaded sieves extending the exact classification to 10^11 with
    per-segment logs, fingerprints and verifier; Lean coverage criterion, n-1-composite family,
    n≡4 mod 6 class and equality-case necessary condition
notes: >-
  Partial result only: neither eventual strict inequality nor divergence of F(n)-n is proved. Through 10^9
  the dense linear sieve and odd-only segmented sieve agree on all 100 equality cases and twelve slack
  thresholds. Through 10^11 a second, multithreaded pair (all-integer sieve with independent warm-up
  segments versus odd-only sieve with one exact carried scan) agrees on all 100 per-segment records,
  including equality cases, 18 slack thresholds, minima, exact slack sums and a 64-bit fingerprint of
  F(n)-n at every index; CI recomputes the first and last 10^9 segments with both programs, while the full
  recomputation is local only. The fingerprint is a probabilistic cross-check, not a certificate. The Lean
  definition differs from the upstream sSup presentation only at the empty small-index boundary. No
  novelty or priority is claimed without external review; upstream research declarations remain
  sorry-backed.
