verify:
- cmd: python3 verify_billion.py
  expected_runtime: ~17-90s depending on hardware and load; peak memory ~4.1 GiB because both independent implementations run through 10^9
  ci_feasible: true
  requires: [g++]
- cmd: python3 verify_extended.py
  expected_runtime: ~10-60s depending on hardware and load; peak memory ~120 MB; recomputes the first and last 10^9 segments with both programs
  ci_feasible: true
  requires: [g++]
- cmd: python3 verify_extended.py --full
  expected_runtime: ~10 min wall with 4 threads here (12 CPU-minutes); under 10 MB per program; recomputes all 100 segments with both programs
  ci_feasible: false
  requires: [g++]
