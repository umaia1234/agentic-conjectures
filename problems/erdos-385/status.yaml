id: erdos-385
title: 'Erdős #385 / #430(i) — elementary subfamilies and exact verification through 10^11'
title_ko: '에르되시 #385 / #430(i) — 초등적 부분족과 10^11까지의 정확한 검증'
domain: erdos
source_url: https://www.erdosproblems.com/385
claimed_status: partial
claim: >-
  Lean-proves F(n)>=n for n>=5, F(n)>n whenever n>=5 and n-1 is not prime (all odd n and all
  n≡4 mod 6), so every equality case is even with n-1 prime; two independent exact sieves classify
  F(n)=n through 10^11, finding the same 100 equality cases (largest 267680) and hence F(n)>n on
  [267681,10^11], while both asymptotic questions remain open.
claim_ko: >-
  Lean으로 n>=5이면 F(n)>=n이고, n>=5이며 n-1이 소수가 아니면(모든 홀수 n과 n≡4 mod 6인
  모든 n) F(n)>n임을 증명하여 모든 등호 사례는 n-1이 소수인 짝수임을 보였다. 서로 독립적인
  두 정확한 체가 10^11까지 F(n)=n인 경우를 분류하여 같은 100개 등호 사례(최댓값 267680)만
  있음을 확인하므로 [267681,10^11] 전체에서 F(n)>n이다. 두 점근적 질문은 여전히 미해결이다.
