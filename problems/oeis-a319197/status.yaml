notes: The refuted claim is only the Formula-section assertion I(n,1)=1, present since OEIS revision 2
  and still present in approved revision 7. The exact counterexample quotient 769 remains a positive integer,
  so it does not refute the entry's broader all-m integrality conjecture. No prior public correction was
  found in targeted searches, but novelty is not claimed; no external submission was made. The same published
  data give I(8,1)=835903=769*1087, while I(9,1)=I(10,1)=1; the refuted subclaim is n=7 only and no minimality
  is asserted.
