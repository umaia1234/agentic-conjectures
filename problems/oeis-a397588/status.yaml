id: oeis-a397588
title: OEIS A397588 — odd terms occur exactly at powers of two
domain: oeis
source_url: https://oeis.org/A397588
claimed_status: proved
claim: >-
  Proves the OEIS parity conjecture for the recurrence a(1)=1 and
  a(n)=(n+1)*sum_{k=1}^{n-1} a(k)*a(n-k): a(n) is odd exactly when n is a
  power of two.
artifacts:
- path: README.md
  kind: informal-proof
verify: []
