    Lean 4 formalization, proof, source and prior-art audit, and bilingual
    documentation
notes: >-
  The proof uses the equivalent convolution recurrence printed on OEIS, not
  the generating-function derivative as a definition. The Lean theorem is
  stronger than needed because it applies to every natural-valued function
  satisfying that recurrence. Targeted public searches found no prior proof,
  but this is unreviewed, has not been submitted to OEIS, and makes no novelty
  claim.
