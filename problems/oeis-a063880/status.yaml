notes: The subfamily theorem is now kernel-checked in AgenticConjectures/OeisA063880.lean against a
  term-for-term copy of the upstream predicate OeisA63880.A (with usigma defined by the upstream
  unitary-divisor sum, and Set.IsPrimitive / Nat.Powerful copied from the upstream companion files);
  "omega(C(n)) <= 2" is encoded as "at most two primes p with p^2 | n" and "C(n) = 108" as
  "n = 108 * s with s squarefree and coprime to 108". The Lean proof follows PROOF.md (multiplicativity
  of sigma and sigma*, the local-ratio bounds, and the q | 3 argument), recovering the solutions by
  strong induction that peels off exponent-1 primes instead of naming the powerful core explicitly.
  The converse (108*s is a term of the subfamily for every squarefree s coprime to 108) and the two
  upstream `textbook` lemmas (primitive terms are powerful; primitive x coprime squarefree is a term)
  are also proved. No computational certificate in the folder; OEIS's reported primitive-term
  search to 10^18 was not independently rerun; the upstream global statements remain sorry-backed and
  are recorded here only as Props; novelty explicitly not asserted before peer review.
