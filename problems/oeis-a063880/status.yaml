notes: The subfamily theorem is kernel-checked in AgenticConjectures/OeisA063880.lean against a
  term-for-term copy of the upstream predicate OeisA63880.A (with usigma defined by the upstream
  unitary-divisor sum, and Set.IsPrimitive / Nat.Powerful copied from the upstream companion files);
  "omega(C(n)) <= k" is encoded as "at most k primes p with p^2 | n" and "C(n) = 108" as
  "n = 108 * s with s squarefree and coprime to 108". The two-prime case (k = 2) follows PROOF.md
  (multiplicativity of sigma and sigma*, the local-ratio bounds, and the q | 3 argument), recovering
  the solutions by strong induction that peels off exponent-1 primes instead of naming the powerful
  core explicitly. The three-prime case (k = 3, THREE_PRIMES.md) shows that no powerful p^a q^b r^c
  is a term, via local-ratio bounds and three finite boxes when 2 is absent, ratio bounds and an
  r | 9 congruence for {2,3,r}, and, for 2^a q^b r^c with 5 <= q < r, an integer reformulation, a
  2-adic valuation identity, size bounds, five boxes and a 16-case quadratic table, all checked
  inside Lean (norm_num / interval_cases / omega, no native_decide). The two Python searches (exact rational and
  integer-only, no solution for 2 <= a <= 28) are an independent cross-check of part of the
  three-prime case, not part of the proof. The converse (108*s is a term of the subfamily for every
  squarefree s coprime to 108) and the two upstream `textbook` lemmas (primitive terms are powerful;
  primitive x coprime squarefree is a term) are also proved. Cores with >= 4 distinct primes are not
  treated; OEIS's reported primitive-term search to 10^18 was not independently rerun; the upstream
  global statements remain sorry-backed and are recorded here only as Props; novelty explicitly not
  asserted before peer review.
