- model: Claude Opus 5.5 (max effort)
  harness: Claude Code
  scope: literature check, two-checker reverification of the published 537 partition, template SAT
    encoder and audit, DRAT-certified 538 template exclusions, tabu/breakout local search
notes: S(6) >= 537 is the published result of Chen, Zhu and Long (arXiv:2610.31362, 2026-10-22), not
  ours; published_537.col equals their ancillary certificate.col and is accepted by verify.py and by the
  independently written check_partition.cpp. frame_537_kissat.col reproduces their frame method and is not
  among their 131 partitions, but it is not a new bound. The n = 538 frame (N = 539) and the other (Q, D)
  values are our extrapolation of their n = 537 Definition 3. DRAT certificates (drat-trim s VERIFIED,
  CNFs audited clause by clause and pinned by SHA-256) cover the 21 frame cells 148 <= Q <= 154, 37 <= D
  <= 39, the --no-middle relaxation of g(151, 38), and the [1,120] and [1,150] prefix classes. Only the
  [1,150] proof is stored and checked in CI; the other proofs (66 MB to 2.3 GB) are regenerated locally by
  certify_templates.sh, whose CNF audit and SHA-256 part runs in CI. Calibrated local search (it fails even
  on the satisfiable 537 frame class) found no 538 partition; every run stalled at two violated cells of
  the shape a+a = 2a, a+2a = 3a. The 2026-08-11 results
  (536 reverification, two-violation near-537 coloring, depth-5 repair exclusion) are kept unchanged.
