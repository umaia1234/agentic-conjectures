verify:
- cmd: python3 reconstruct_published.py published_536_half.txt > /tmp/reconstructed_536.col && cmp /tmp/reconstructed_536.col
    published_536.col && python3 verify.py published_536.col --maximum 536
  expected_runtime: unknown
  ci_feasible: true
- cmd: python3 repair_search.py near_537_two_violations.col --maximum 537 --colors 6 --depth 5 --seconds
    60; test $? -eq 2
  expected_runtime: <= 60 s (stated cap; 232,887 nodes exhausted). Exit 2 = search exhausted without finding
    a repair, which is exactly the certified negative result, hence the wrapper.
  ci_feasible: true
- cmd: python3 verify.py published_537.col --maximum 537 && python3 verify.py frame_537_kissat.col --maximum
    537 && g++ -O2 -std=c++17 check_partition.cpp -o /tmp/schur6_check && /tmp/schur6_check published_537.col
    537 && /tmp/schur6_check frame_537_kissat.col 537 && /tmp/schur6_check published_536.col 536 && /tmp/schur6_check
    near_538_two_violations.col 538 | grep -q "monochromatic_triples=2 structural_problems=0"
  expected_runtime: about 3 s (two independent checkers on both 537 partitions and the 536 partition; the
    near-538 data file has exactly two monochromatic triples)
  ci_feasible: true
  requires:
  - g++
- cmd: python3 template_sat.py cnf --maximum 538 --fix published_537.col 150 > /tmp/schur6_prefix150.cnf
    && python3 audit_template_cnf.py /tmp/schur6_prefix150.cnf --maximum 538 --fix published_537.col 150
    --sha256 11747b52a391cacffa8235ccdec8d8e61574ec4b22e39b05887f44d686e1bca5 && drat-trim /tmp/schur6_prefix150.cnf
    prefix150_538_unsat.drat
  expected_runtime: about 1 min (CNF 2 s, audit 1 s, drat-trim 53 s CPU on a loaded machine)
  ci_feasible: true
  requires:
  - drat-trim
- cmd: bash certify_templates.sh --audit-only
  expected_runtime: about 20 s (CNF regeneration, SHA-256 and clause audit of the 23 listed classes)
  ci_feasible: true
- cmd: bash certify_templates.sh
  expected_runtime: about 5 h in sequence for the 23 listed classes (per class kissat 1-17 min CPU, drat-trim
    1-24 min, temporary DRAT proof of 0.07-2.3 GB)
  ci_feasible: false
  requires:
  - kissat
  - drat-trim
