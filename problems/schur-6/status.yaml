id: schur-6
title: Independent Schur-6 attempt
title_ko: 독립적인 Schur-6 시도
domain: other
source_url: ''
claimed_status: partial
claim: 'Re-verifies with two independent checkers the published S(6) >= 537 partition of Chen, Zhu and
  Long (arXiv:2610.31362) and the earlier 536 partition; no 6-partition of [1,538] was found, and DRAT
  certificates exclude only specific classes at 538: 22 palindromic frame classes (our N = 539 version of
  their frame) and the colorings that agree with their partition on [1,120].'
claim_ko: >-
  Chen, Zhu, Long(arXiv:2610.31362)이 출판한 S(6) >= 537 분할과 이전의 536 분할을 서로 독립적인 두
  검사기로 재검증한다. [1,538]의 합-자유 6-분할은 찾지 못했으며, 538에서는 특정한 부류만을 DRAT
  인증으로 배제한다. 배제한 부류는 22개의 회문(palindromic) 프레임 부류(그들의 프레임을 N = 539에 맞게
  옮긴 우리의 버전)와, [1,120]에서 그들의 분할과 일치하는 색칠들이다.
