id: additive-sink-wall-duality
title: Additive sink subtraction — the sink–wall duality conjecture, proved
title_ko: 덧셈형 싱크 빼기 게임 — 싱크–벽 쌍대성 추측의 증명
domain: other
source_url: https://arxiv.org/abs/2601.18715v3
claimed_status: proved
claim: >-
  Lean-proves equation (3) of arXiv:2601.18715v3 (Bhagat, Larsson, Manabe and Yamashita): for every
  additive set S = {s1, s2, s1 + s2} with 1 <= s1 < s2 and every integer x,
  v_wall([x]_p) = sigma(v_sink([-s2 - x]_p)), where p is the period length of their Theorem 3 and
  sigma swaps the values 0 and 2 (AgenticConjectures.AdditiveSinkWallDuality.statement_holds).
claim_ko: >-
  arXiv:2601.18715v3(Bhagat, Larsson, Manabe, Yamashita)의 식 (3)을 Lean으로 증명했다. 1 <= s1 < s2인
  모든 덧셈형 집합 S = {s1, s2, s1 + s2}와 모든 정수 x에 대해 v_wall([x]_p) = sigma(v_sink([-s2 - x]_p))가
  성립한다. 여기서 p는 논문 정리 3의 주기 길이이고, sigma는 값 0과 2를 맞바꾼다
  (AgenticConjectures.AdditiveSinkWallDuality.statement_holds).
