notes: >-
  The conjecture is due to Anjali Bhagat, Urban Larsson, Hikaru Manabe and Takahiro Yamashita
  (arXiv:2601.18715v3, equation (3)). Searches on 2026-10-25 found no earlier proof or disproof, but no
  novelty is claimed. The statement is ours (Formal Conjectures has none); its choices are listed in
  the module docstring and DETAILS.md: both games are defined by their mex recursions, p is the formula
  of Theorem 3 (proved here to be a period of both nim-sequences, not the least one; check_duality.py
  confirms minimality for s2 <= 200), x ranges over the integers, and every 1 <= s1 < s2 is covered,
  with no gcd or regime condition. The wall side (the value classes and the bracket formula) is known
  for coprime pairs with s1 >= 2 (Manabe, arXiv:2609.05358v2, whose Lean formalization was used as a
  reference only), and the bracket formula itself is classical (Winning Ways; Flammenkamp's thesis);
  this proof re-proves what it needs for every pair. An earlier scouting run of this
  project found the route through (T1)-(T3). No human has reviewed the proof, and nothing has been
  reported to the authors or submitted anywhere.
