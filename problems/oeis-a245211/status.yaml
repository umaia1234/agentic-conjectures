id: oeis-a245211
title: 'OEIS A245211: a(n)=n only for n=21'
title_ko: 'OEIS A245211: a(n)=n인 것은 n=21뿐'
domain: oeis
source_url: https://oeis.org/A245211
claimed_status: partial
claim: 'Claims partial progress only: Lean proves A(21)=21, excludes every prime power, shows a product of
  two distinct primes solves A(n)=n only for n=21, and proves τ(n/p)<p for every prime divisor of a positive
  solution. Coprimality to 2310, the remaining factorization exclusions, and the exact searches through
  10^9 and two-prime exponents ≤200 stay outside that kernel check; uniqueness of 21 is open.'
claim_ko: >-
  부분적 진전만을 주장한다. Lean으로 A(21)=21, 모든 소수 거듭제곱의 배제, 서로 다른 두 소수의
  곱 중 해는 21뿐이라는 분류, 그리고 양의 해의 각 소인수 p에 대해 τ(n/p)<p임을 증명했다.
  2310과의 서로소 조건, 나머지 인수분해 배제, n ≤ 10^9 및 두 소인수 지수 ≤200의 정확한 검색은
  이 커널 검증 밖에 있으며, 21의 유일성은 미해결이다.
