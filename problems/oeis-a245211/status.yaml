notes: README opens by stating the full conjecture remains unresolved. Kernel-checked here are A(21)=21,
  the exclusion of every prime power p^k with k≥1, the classification of products of two distinct primes,
  and τ(n/p)<p for each prime divisor of a positive solution. The coprimality-to-2310 argument, the
  squarefree three-prime and even-ω exclusions, nonsquarefree numbers with two or more prime factors,
  and the finite searches are not part of that Lean proof. Remaining gaps are two-prime cases with
  exponents > 200, nonsquarefree n with ≥ 3 prime factors, and squarefree n with an odd number r ≥ 5
  of prime factors. The upstream Lean uniqueness theorem is still a sorry-marked conjecture statement;
  our `statement` is the same proposition and is not proved. A is the proper-divisor sum, proved equal
  to the upstream subtraction form by A_eq_full_sub, including at n=0 where both sides are 0. The open
  quantifier starts at 0<n, as upstream does; A 0 = 0, so zero cannot be included in the equivalence.
