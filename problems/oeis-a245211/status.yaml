id: oeis-a245211
title: 'OEIS A245211: a(n)=n only for n=21'
title_ko: 'OEIS A245211: a(n)=n인 것은 n=21뿐'
domain: oeis
source_url: https://oeis.org/A245211
claimed_status: partial
claim: 'Claims only partial progress: Lean-verifies that any counterexample to the uniqueness of n=21
  is coprime to 2310 and, if squarefree, has an odd number >= 5 of distinct prime factors; exact
  computation (not rerun in CI) covers all n <= 10^9 and two-prime-factor n with exponents <= 200;
  the conjecture itself remains unresolved.'
claim_ko: >-
  부분적 진전만을 주장한다. n=21의 유일성에 대한 모든 반례가 2310과 서로소이고, squarefree라면
  서로 다른 소인수가 5개 이상의 홀수 개여야 함을 Lean으로 검증했다. 모든 n <= 10^9와 서로 다른
  소인수가 두 개이고 각 지수가 <= 200인 모든 n은 정확한 계산으로 확인했지만(CI에서 재실행하지
  않음), 추측 자체는 여전히 미해결이다.
