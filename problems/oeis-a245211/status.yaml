notes: README opens by stating the full conjecture remains unresolved; remaining gaps are two-prime cases
  with exponents > 200, nonsquarefree n with >= 3 prime factors, and squarefree n with an odd number r
  >= 5 of prime factors; upstream Lean uniqueness theorem is a sorry-marked conjecture statement.
  DETAILS.md Sections 1-3, 5 and 6 (product form, lower bound, prime powers, squarefree classification,
  gcd(n,2310)=1) are kernel-checked in AgenticConjectures/OeisA245211.lean against a term-for-term copy
  of the upstream definition of a (Nat subtraction that never truncates). The Lean Section 6 proof
  refutes every exponent pattern allowed by the lower bound directly (linear equations, q^b | H_a(p),
  parity of the product form) instead of filtering with the 2-adic condition (A245-7), which, like the
  10^9 scan and the two-prime exponent search, is not formalized.
