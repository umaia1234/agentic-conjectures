notes: >-
  The proof is ordinary mathematics, not Lean: CI re-verifies the certificate and the Lean statements
  plus the closed-form => recurrence implications, but the graph-theoretic core (that the counts equal
  the closed forms) is not machine-checked. Unreviewed, not submitted to OEIS, and no novelty claimed.
  Prior-art check: the third family member A286182 (prism) is NOT open — its closed form is Lemma 7.2 of
  A. Vince, J. Graph Theory 97 (2021) 82-103, quoted as such in arXiv:2105.13332 §2; the OEIS entry has
  merely never been updated, and A286182 is included here only as a validation of the method. For
  A286185 and A286183 no proof was found in OEIS (including full revision history), the arXiv full-text
  API, Google Scholar or MathWorld as of 2026-08-12, but a negative search proves nothing. The Step 3
  argument requires n >= 3; n = 1, 2 are degenerate (K_2 and K_4) and are checked directly. The
  recurrences hold for n >= 7 and fail at n = 6. The certificate cross-checks against the graphs built by
  the OEIS entries' own Mathematica programs; for the antiprism the two constructions are mirror images
  (isomorphic), which the certificate verifies rather than assumes.
