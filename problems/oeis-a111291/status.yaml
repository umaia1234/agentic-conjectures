notes: >-
  Computer-assisted and unreviewed. The Lean `statement` is a faithful copy of upstream
  `colton_conjecture` but stays an unproved `def ... : Prop`; Lean checks only the elementary
  lemmas (odd refactorable numbers are squares, 2u versus u, the generator lemma, the
  disjoint-family lower bound, the grid step, pi(7) = 2T(7)). The proof also trusts the C++ and
  Python programs and Dusart's explicit bounds for pi (checked against arXiv:1002.0442v1 only;
  Rosser-Schoenfeld 1962 and Dusart 1999 were not re-read). For n <= 10^12 two independent
  programs prove the statement (grid via tau_count, pointwise sieve); the tail for n >= 10^12 uses
  neither. Zelinsky's Theorem 8 plus the grid to 10^15 is an independent second route; his
  Lemma 9 has an inadequate justification that Theorem 8 does not need. A111291 terms a(12..15)
  computed here are not submitted to OEIS. No novelty is claimed; nothing was reported externally.
