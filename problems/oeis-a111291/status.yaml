id: oeis-a111291
title: "OEIS A111291 — Colton's conjecture pi(n) <= 2T(n), computer-assisted proof"
title_ko: "OEIS A111291 — 콜턴 추측 pi(n) <= 2T(n)의 컴퓨터 보조 증명"
domain: oeis
source_url: https://oeis.org/A111291
claimed_status: proved
claim: >-
  Claims a computer-assisted proof of Colton's conjecture pi(n) <= 2T(n) for every n, where T(n)
  counts refactorable numbers <= n, with equality only at n = 0 and 7: brute force to 10^6, an
  exact grid certificate on [10^6, 1.13*10^13], and an analytic tail for n >= 10^12 built on
  Zelinsky's p-generators, exactly computed constants and Dusart's explicit bounds for pi. Lean
  checks the statement and elementary lemmas only.
claim_ko: >-
  T(n)을 n 이하의 refactorable 수의 개수라 할 때, 모든 n에 대해 콜턴 추측 pi(n) <= 2T(n)이
  성립하고 등호는 n = 0, 7에서만 성립함을 컴퓨터 보조 증명으로 주장한다. 10^6까지는 전수 검사,
  [10^6, 1.13*10^13]에서는 정확한 값으로 만든 격자 인증서, n >= 10^12에서는 Zelinsky의
  p-생성수, 정확히 계산한 상수, Dusart의 명시적 pi 상계·하계에 기반한 해석적 꼬리 논증을 쓴다.
  Lean은 명제와 기초 보조정리만 검증한다.
