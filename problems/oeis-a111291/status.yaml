verify:
- cmd: python3 verify_small.py
  expected_runtime: about 1 s (n <= 10^6)
  ci_feasible: true
- cmd: >-
    g++ -O3 -std=c++17 tau_count.cpp -o /tmp/oeis_a111291_tau_count &&
    python3 verify_grid.py /tmp/oeis_a111291_tau_count 10000000000000
  expected_runtime: about 6 s (66 grid points up to 1.13*10^13)
  ci_feasible: true
  requires: [g++]
- cmd: >-
    g++ -O3 -std=c++17 generators.cpp -o /tmp/oeis_a111291_generators &&
    python3 verify_tail.py /tmp/oeis_a111291_generators
  expected_runtime: about 2 s (413,980 generators re-checked; exact arithmetic)
  ci_feasible: true
  requires: [g++]
- cmd: >-
    g++ -O3 -std=c++17 tau_count.cpp -o /tmp/oeis_a111291_tau_count &&
    python3 verify_grid.py /tmp/oeis_a111291_tau_count
  expected_runtime: about 2.5 min and 0.7 GB (full grid to 10^15)
  ci_feasible: false
  requires: [g++]
- cmd: >-
    g++ -O3 -std=c++17 -pthread colton_sieve.cpp -o /tmp/oeis_a111291_sieve &&
    /tmp/oeis_a111291_sieve 1000000000000 3 logs/sieve_1e12_checkpoints.txt
  expected_runtime: about 16 min with 3 threads (every n <= 10^12)
  ci_feasible: false
  requires: [g++]
- cmd: >-
    g++ -O3 -std=c++17 tau_count.cpp -o /tmp/oeis_a111291_tau_count &&
    python3 crosscheck_sieve_log.py /tmp/oeis_a111291_tau_count
  expected_runtime: about 65 s (1433 checkpoints up to 10^12)
  ci_feasible: false
  requires: [g++]
- cmd: >-
    g++ -O3 -std=c++17 -pthread colton_sieve.cpp -o /tmp/oeis_a111291_sieve &&
    g++ -O3 -std=c++17 tau_count.cpp -o /tmp/oeis_a111291_tau_count &&
    python3 spot_check.py /tmp/oeis_a111291_sieve /tmp/oeis_a111291_tau_count
  expected_runtime: about 4.5 min with 3 threads (four intervals of length about 2*10^9)
  ci_feasible: false
  requires: [g++]
- cmd: python3 crosscheck_primecount.py
  expected_runtime: about 1 s with primecount 8.8
  ci_feasible: false
  requires: [primecount]
- cmd: >-
    g++ -O3 -std=c++17 -pthread colton_sieve.cpp -o /tmp/oeis_a111291_sieve &&
    g++ -O3 -std=c++17 tau_count.cpp -o /tmp/oeis_a111291_tau_count &&
    python3 test_bruteforce.py /tmp/oeis_a111291_sieve /tmp/oeis_a111291_tau_count
  expected_runtime: about 13 s; needs numpy
  ci_feasible: false
  requires: [g++]
