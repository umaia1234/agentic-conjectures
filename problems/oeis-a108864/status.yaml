id: oeis-a108864
title: OEIS A108864 — 1155 is not the last odd term (815634435)
title_ko: OEIS A108864 — 1155는 마지막 홀수 항이 아님 (815634435)
domain: oeis
source_url: https://oeis.org/A108864
claimed_status: refuted
claim: 'Lean-refutes the Formal Conjectures statement that every term a(n), n > 58, is even: the odd
  number 815634435 = 3*5*7*11*547*1291 has sigma = 2n - 6, hence perfect deficiency 6 <= 10, and it
  is the term of index Nat.count A 815634435 > 58, so 1155 is not the last odd term.'
claim_ko: >-
  n > 58인 모든 항 a(n)이 짝수라는 Formal Conjectures 명제를 Lean으로 반박했다. 홀수
  815634435 = 3*5*7*11*547*1291은 sigma = 2n - 6이므로 perfect deficiency가 6 <= 10이고,
  색인 Nat.count A 815634435 > 58의 항이므로 1155는 마지막 홀수 항이 아니다.
