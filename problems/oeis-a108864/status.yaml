notes: The definitions are copied term for term from the upstream snapshot; only the module header,
  namespace, attributes, and test theorems were adapted or dropped, and the five upstream test proofs
  still pass against the local definitions. The fold is evaluated by the kernel only on the 59 small
  terms 1..1155 (about 11,500 steps). The witness is handled by the key lemma (proper-divisor sum at most
  n implies perfect deficiency 2n - sigma(n)) and by the multiplicativity of sigma, never by running the
  fold. Only index > 58 is proved; the exact index of 815634435 is not determined, and it is not claimed
  to be the smallest odd term after 1155. The index base (0-indexed a 58 = 1155) and the agreement of the
  upstream skip-and-continue fold with the A109883 stop-at-first PARI program (n <= 2000) are checked by
  the Python certificate, not in Lean. sigma(815634435) = 2n - 6 is long known (A087485, A141548,
  A077374, A088012); none of those entries mentions A108864. Unreviewed, no novelty is claimed, and
  nothing was submitted externally.
