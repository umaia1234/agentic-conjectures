verify:
- cmd: python3 a007406_certificate.py --self-test --fraction-max 3000 --direct-max 30000 --tree-max 20000
  expected_runtime: about 7 seconds (Python 3.12, Apple M5 Max)
  ci_feasible: true
- cmd: python3 a007406_certificate.py --hits logs/roots_R1_2642245.txt logs/roots_R2_2642245.txt
  expected_runtime: about 30 seconds (Python 3.12, Apple M5 Max)
  ci_feasible: true
- cmd: cc -O3 -std=c11 -pthread a007406_roots_mont.c -o /tmp/a007406_roots_mont && cc -O3 -std=c11 -pthread
    a007406_roots_lin.c -o /tmp/a007406_roots_lin && /tmp/a007406_roots_mont 5 2642245 4 > /tmp/a007406_R1.txt
    && /tmp/a007406_roots_lin 5 2642245 4 > /tmp/a007406_R2.txt && python3 a007406_certificate.py --hits
    /tmp/a007406_R1.txt /tmp/a007406_R2.txt
  expected_runtime: R1 23 min wall / 38 CPU-min and R2 81 min wall / 153 CPU-min with 2 threads
    each on a shared Apple M5 Max, plus about 30 seconds for the hit check
  ci_feasible: false
  requires: [cc]
- cmd: printf 'children(7, 3, 13)\nchildren(16843, 8421, 13)\nchildren(16843, 16842, 13)\nchildren(2124679,
    1062339, 13)\nchildren(2124679, 2124678, 13)\n' | gp -q -D parisizemax=4G a007406_children.gp | grep -c '\[\] ('
    | grep -qx 5
  expected_runtime: about 30 seconds (PARI/GP 2.19.0)
  ci_feasible: false
  requires: [gp]
- cmd: python3 a007406_certificate.py --direct-max 1000000
  expected_runtime: about 12 minutes (Python 3.12, Apple M5 Max)
  ci_feasible: false
- cmd: echo 'check(10^6)' | gp -q -D parisizemax=2G a007406_direct.gp | grep -q 'mismatches=0,'
