notes: The conjecture is not proved. Lean proves the prime half (classical), the 2-, 3- and 5-parts,
  the reduction to v_q(H2(m)) <= 2 for primes q >= 5, and the families listed in the README; the
  bounds for 5 <= q <= 2,642,245, and hence the range 3 < n <= 5,284,491, are computational, not
  Lean. CI re-runs the complete trees for q <= 20,000 and re-verifies the committed hit logs (each
  hit recomputed mod q^15, its children expanded mod q^13), but not the root scan for 20,000 < q <=
  2,642,245, which rests on two independent C scanners with identical hit lists and counts. The five
  hits are explained by classical congruences (Wolstenholme primes 16843 and 2124679, and q = 7).
  Nothing here is claimed to be new; the result has not been reported to OEIS.
