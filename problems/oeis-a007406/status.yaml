id: oeis-a007406
title: OEIS A007406 — gcd conjecture reduced and checked to n ≤ 5,284,491
title_ko: OEIS A007406 — gcd 추측의 환원과 n ≤ 5,284,491까지의 검증
domain: oeis
source_url: https://oeis.org/A007406
claimed_status: partial
claim: Lean-proves the prime half, the 2-, 3- and 5-parts, the equivalence of the conjecture with
  v_q(H2(m)) <= 2 for all primes q >= 5, and the cases n = tq (2 <= t <= 6) and 5-smooth n; a Boyd-tree
  certificate checks that bound for all primes q <= 2,642,245, which by the Lean reduction gives the
  conjecture for every 3 < n <= 5,284,491.
claim_ko: >-
  소수 경우, 2·3·5 부분, 추측과 '모든 소수 q >= 5에 대해 v_q(H2(m)) <= 2'의 동치, 그리고
  n = tq (2 <= t <= 6)와 5-매끄러운 n의 경우를 Lean으로 증명했다. 또한 Boyd 트리 인증서로 모든
  소수 q <= 2,642,245에 대해 그 상계를 확인했고, Lean 환원에 의해 이는 모든 3 < n <= 5,284,491에서
  추측이 성립함을 뜻한다.
