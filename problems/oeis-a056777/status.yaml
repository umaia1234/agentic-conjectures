id: oeis-a056777
title: OEIS A056777 / Choudhury–Wei Conjecture 1.1 — structural lemmas, search to 10^12
title_ko: OEIS A056777 / Choudhury–Wei 추측 1.1 — 구조 보조정리와 10^12까지의 탐색
domain: oeis
source_url: https://arxiv.org/abs/2606.10331v3
claimed_status: partial
claim: >-
  Lean-verifies that for composite n with phi(n+12)=phi(n)+12 and sigma(n+12)=sigma(n)+12, neither
  n nor n+12 is a prime power, sigma(n) is even, and if n and n+12 are both products of two distinct
  primes then n=p(p+8) from a prime quadruple; two independent exact sieves (the second through
  10^11, closed-form totals to 10^12) find exactly the 166 predicted solutions n<=10^12, while
  Conjecture 1.1 remains open.
claim_ko: >-
  phi(n+12)=phi(n)+12이고 sigma(n+12)=sigma(n)+12인 합성수 n에 대해 n과 n+12는 소수 거듭제곱이
  아니고 sigma(n)은 짝수이며, n과 n+12가 모두 서로 다른 두 소수의 곱이면 n은 소수 사중쌍에서 오는
  p(p+8)임을 Lean으로 검증했다. 독립적인 두 정확한 체(두 번째는 10^11까지, 10^12까지는 닫힌 식
  합계로 대조)가 n<=10^12에서 예측된 166개의 해만 찾았다. 추측 1.1은 여전히 미해결이다.
