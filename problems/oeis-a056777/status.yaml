notes: >-
  The n+12 prime-power exclusion is kernel-checked in AgenticConjectures/OeisA056777.lean against a
  term-for-term copy of the upstream predicate OeisA56777.A (composite n, both equations additive in
  Nat; the only spelling difference is mathlib's phi notation for Nat.totient); the Lean proof
  follows PROOF.md except that the q=2 case reuses the key inequality phi(m)*sigma(m)+m<m^2 for
  non-prime-powers (plus the equations phi(w)=w-3, 7*sigma(w)=8w+11 for n=4w) instead of the
  sigma-parity argument, and the q=3 case closes with the parity of phi. The later lemmas
  (n not a prime power, the semiprime case, sigma parity) reprove facts stated in the paper
  (Theorem 3.1, Theorem 2.2) or follow from elementary parity arguments; none is claimed to be new.
  The search is finite evidence only and adds nothing beyond 10^12: it reproduces the authors'
  reported search and the OEIS b-file. Implementation 1 follows the same general cofactor scheme
  as the paper's program (written without seeing its code); implementation 2 (an exponent-count
  sieve) covers only n<=10^11, so above 10^11 the individual phi and sigma values are backed only
  by the aggregate closed-form checks at 4*10^11, 7*10^11 and 10^12 and by the hit list matching an
  independent prime-quadruple sieve. There is no Lean certificate for the search; CI rebuilds the
  C++ programs, reruns implementation 1 through 10^9 against a pure-Python reference and the
  closed forms, and audits the committed logs, but does not rerun the 10^12 search. Novelty is
  explicitly not asserted; the upstream universal Lean statement (Conjecture 1.1) remains
  sorry-backed and is recorded here only as a Prop (`statement`).
