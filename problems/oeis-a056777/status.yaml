notes: The n+12 prime-power exclusion is now kernel-checked in AgenticConjectures/OeisA056777.lean
  against a term-for-term copy of the upstream predicate OeisA56777.A (composite n, both equations
  additive in Nat; the only spelling difference is mathlib's phi notation for Nat.totient); the Lean
  proof follows PROOF.md except that the q=2 case reuses the key inequality phi(m)*sigma(m)+m<m^2
  for non-prime-powers (plus the equations phi(w)=w-3, 7*sigma(w)=8w+11 for n=4w) instead of the
  sigma-parity argument, and the q=3 case closes with the parity of phi.
  The authors' reported 10^12 search was not independently rerun; negative public searches for
  the same lemma are noted but novelty is explicitly not asserted before peer review; the upstream
  universal Lean statement (Conjecture 1.1) remains sorry-backed and is recorded here only as a
  Prop (`statement`).
