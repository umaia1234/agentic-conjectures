id: oeis-a056777
title: OEIS A056777 / Choudhury–Wei Conjecture 1.1 — n+12 not a prime power
title_ko: OEIS A056777 / Choudhury–Wei 추측 1.1 — n+12는 소수 거듭제곱이 아님
domain: oeis
source_url: https://arxiv.org/abs/2606.10331v3
claimed_status: partial
claim: Lean-verifies that for composite n>=4 with phi(n+12)=phi(n)+12 and sigma(n+12)=sigma(n)+12,
  n+12 cannot be a prime power (kernel-checked against the upstream predicate); the original
  Choudhury–Wei Conjecture 1.1 remains unresolved.
claim_ko: >-
  phi(n+12)=phi(n)+12이고 sigma(n+12)=sigma(n)+12인 합성수 n>=4에 대해 n+12는 소수 거듭제곱일 수
  없음을 Lean으로 검증했다(상류 술어 그대로 커널 검사). 원래의 Choudhury–Wei 추측 1.1은 여전히
  미해결이다.
