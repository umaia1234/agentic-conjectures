id: chvatal-downset
title: Chvatal's downset conjecture — saturated SAT reduction
title_ko: Chvatal의 하향 닫힌 집합 추측 — 포화 SAT 환원
domain: graph-combinatorics
source_url: https://github.com/google-deepmind/formal-conjectures/blob/9118d083ffca1536f521f9a7d103201f537ea670/FormalConjectures/Paper/Chvatal.lean
claimed_status: partial
claim: Proves an elementary saturation lemma and reports an uncertified n=6 UNSAT exclusion of counterexamples
  under stated reductions; n=8 attempts timed out and the general conjecture remains open.
claim_ko: >-
  기초적인 포화 보조정리를 증명하고, 명시된 환원 아래 n=6에서 반례가 없다는 인증되지 않은 UNSAT 결과를
  보고한다. n=8 시도는 시간 초과로 끝났으며 일반 추측은 여전히 미해결이다.
artifacts:
- path: README.md
  kind: informal-proof
- path: generate_cnf.py
  kind: search-code
- path: n6_solver_result.json
  kind: data
- path: n8_attempt_summary.md
  kind: other
- path: upstream/README.md
  kind: upstream-lean
verify:
- cmd: python -m venv /tmp/chvatal-sat-venv && /tmp/chvatal-sat-venv/bin/pip install "python-sat[pblib]"
    && /tmp/chvatal-sat-venv/bin/python generate_cnf.py --n 6 --reduced --encoding cardnet --solve
  expected_runtime: unknown (result JSON records ~6.6s solve)
  ci_feasible: true
- cmd: /tmp/chvatal-sat-venv/bin/python generate_cnf.py --self-test
  expected_runtime: unknown
  ci_feasible: true
attribution:
- model: GPT-5.6 Sol
  harness: Codex Desktop
  scope: original research artifacts (proofs, certificates, searches, surveys)
notes: README explicitly claims no new case of the conjecture (n<=7 already settled in the literature);
  n=6 CaDiCaL UNSAT has no DRAT/LRAT certificate ('uncertified solver reproduction'); n=8 MILP and feasibility
  runs hit time limits without deciding; upstream Lean statement is sorry-backed.
