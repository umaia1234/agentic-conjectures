notes: The counterexample uses positive OEIS input 15 and m>r, so neither offset nor truncated subtraction
  causes it. It refutes only the Goldbach-like statement and its Formal Conjectures formalization, not
  the separate characterization of a(n)=2 by products of two distinct primes or the twin-prime specialization.
  The Python certificate independently uses divisor enumeration and multiplicative prime-factor formulas.
  Unreviewed; no novelty is claimed and nothing was submitted upstream. The converse direction also fails
  independently at (m,r)=(2,0), where 2 and 2 are primes summing to 2m=4 but a(4)=3; the chosen (8,7)
  witness is the one that kills the direction the entry's Goldbach note relies on.
