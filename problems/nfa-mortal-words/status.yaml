notes: README explicitly makes no claim that the small extremal values are new. The exhaustive claims
  are limited to binary alphabets, k=2 and n<=6; counts are for labelled states and ordered letters, with
  isomorphism classes reported separately. The n=5 and n=6 values rest on two C++ enumerators written by
  the same agent in one session but with no shared code and different algorithms and symmetry reductions
  (state-relabelling orbits of the first letter vs. of the second letter, plus a fully unreduced run for
  n<=5); they agree on every count and histogram for n<=6 and reproduce the earlier n<=4 results. CI reruns
  both for n<=5 only; the n=6 runs (minutes with 6 threads) and the n=4 run of enumerate_binary_n4.cpp are
  local-only. The 7-state value 35 is a lower bound from a heuristic search only. Small-n binary data do
  not bear on the asymptotic n^(k+1) tightness question.
