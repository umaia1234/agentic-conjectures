id: nfa-mortal-words
title: Mortal words in small image-bounded NFAs (Kiefer–Ryzhikov)
title_ko: 도달 상태 집합의 크기가 작게 제한된 NFA의 소멸 단어(Kiefer–Ryzhikov)
domain: other
source_url: https://doi.org/10.4230/LIPIcs.MFCS.2025.62
claimed_status: partial
claim: Claims exact maximum shortest-mortal-word lengths 1,3,7,10,17,24 for labelled ordered binary
  2-image-bounded NFAs with n=1..6 states (n=5,6 by two separately written exhaustive enumerators that
  agree on all counts; all maximizers classified up to isomorphism), plus a 7-state lower-bound witness of
  length 35; the paper's general n^(k+1) tightness question is not resolved.
claim_ko: >-
  레이블된 상태가 n=1..6개이고 두 알파벳 기호가 구별되는 이진 2-image-bounded NFA에서 최단 소멸
  단어 길이의 정확한 최댓값이 각각 1,3,7,10,17,24임을 주장한다. n=5,6의 값은 따로 작성된 두 전수
  열거 프로그램이 모든 개수와 히스토그램에서 일치하여 확인되었고, 최댓값을 갖는 NFA를 동형 기준으로
  모두 분류했다. 또한
  7개 상태에서 최단 길이가 적어도 35임을 보이는 증거를 제시한다. 논문이 제기한 일반적인 n^(k+1)
  상한의 최적성 문제는 해결하지 않는다.
