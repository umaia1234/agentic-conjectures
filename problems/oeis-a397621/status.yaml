id: oeis-a397621
title: OEIS A397621 Pascal-row linear complexity
title_ko: OEIS A397621 파스칼 행의 선형 복잡도
domain: oeis
source_url: https://oeis.org/A397621
claimed_status: proved
claim: Lean-proves A397621(A001317(n)) = 2^(floor(log2 n)+1) - n = A080079(n) for all n >= 1, with
  linear complexity as the Berlekamp-Massey span, a zero-run lower bound, and the connection polynomial
  (1+x)^d as upper bound.
claim_ko: >-
  선형 복잡도를 Berlekamp-Massey 길이로 읽어, 모든 n >= 1에 대해
  A397621(A001317(n)) = 2^(floor(log2 n)+1) - n = A080079(n)임을 0의 연속 구간을 이용한
  하한과 연결 다항식 (1+x)^d를 이용한 상한으로 Lean에서 증명한다.
