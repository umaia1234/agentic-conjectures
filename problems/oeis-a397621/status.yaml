notes: Not peer reviewed and not confirmed by OEIS editors; novelty search negative but explicitly inconclusive;
  README distinguishes this fixed finite-row problem from adjacent literature on infinite Pascal diagonal
  sequences; upstream OEIS Formula section still marked the identity as Conjecture on 2026-08-11. The Lean
  module reads linear complexity as the Berlekamp-Massey span, as the OEIS name says and the data value
  a(2)=1 requires (checked as a_two); the entry's comment calling it a connection-polynomial degree would
  differ at n=2. A080079 enters through its OEIS closed form 2*2^floor(log2 n) - n, not its carry-sequence
  definition.
