attribution:
- model: GPT-5.6 Sol
  harness: Codex Desktop
  scope: original research artifacts (proofs, certificates, searches, surveys)
- model: Claude Opus 5.5 (max effort)
  harness: Claude Code
  scope: Lean 4 formalization of both conjectures, the upstream prime-period statement, and the explicit
    periods
notes: Not peer reviewed and not confirmed by OEIS editors; novelty rests only on a negative public search
  as of 2026-08-11; PROOF.md warns that stated periods are a period, not necessarily minimal (prime minimal
  period only claimed to divide 2(p-1)); upstream Lean snapshot covers only the prime-modulus statement
  and is sorry-marked. The Lean module copies the upstream definition term for term and proves the upstream
  statement verbatim; it formalizes "minimum period divides 2(p-1)" as every positive period with no smaller
  positive period dividing 2(p-1), and proves eventual periodicity for every modulus although the OEIS
  conjecture names only composite moduli.
