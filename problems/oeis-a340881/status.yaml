id: oeis-a340881
title: OEIS A340881 modular periodicity
title_ko: OEIS A340881 모듈러 주기성
domain: oeis
source_url: https://oeis.org/A340881
claimed_status: proved
claim: Lean-proves both OEIS periodicity conjectures, including the minimum-period clause for primes
  (minimal period divides 2*(p-1)), with explicit pure period 2*ord_m(2) from n=1 for odd m and period
  2*ord_u(2) from n>=max(1,e) for every m=2^e*u >= 2, u odd.
claim_ko: >-
  소수 법의 최소주기 조건(최소주기가 2*(p-1)의 약수)을 포함해 OEIS의 두 주기성 추측을
  Lean으로 증명한다. 홀수 m에서는 n=1부터 2*ord_m(2)가 명시적 순수 주기이고, u가 홀수인
  모든 m=2^e*u >= 2에서는 n>=max(1,e)부터 2*ord_u(2)가 주기이다.
artifacts:
