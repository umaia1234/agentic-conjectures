notes: >-
  The official page was retrieved on 2026-08-12 and still listed problem 3
  at 200 EUR with “No solutions received.” The proof resolves the literal
  specification, whose only condition on each Ii is finite positivity and
  which places no parameter-independent size or uniformity bound on those
  sets. A stronger intended restriction would be a different statement.
