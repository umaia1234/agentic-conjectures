id: oeis-a395412
title: OEIS A395412 certified finite nonvanishing extension
title_ko: OEIS A395412 — 비영성이 인증된 유한 범위 확장
domain: oeis
source_url: https://oeis.org/A395412
claimed_status: partial
claim: 'Claims a certified finite extension only: reproduces the 84 published terms and proves
  a(n) > 0 for every 85 <= n <= 478 by one witness per n whose candidate has an ECPP certificate
  checked by PARI/GP and by an independent checker; no range remains that is only BPSW-screened, and
  nothing is claimed beyond 478.'
claim_ko: >-
  인증된 유한 범위 확장만을 주장한다. 공개된 84개 항을 재현하고, 각 n마다 후보에 PARI/GP와
  독립 검사기가 확인한 ECPP 인증서가 있는 증인 하나를 들어 모든 85 <= n <= 478에 대해
  a(n) > 0임을 증명한다. BPSW 선별만 된 구간은 남아 있지 않으며 478을 넘는 범위에 대해서는
  아무것도 주장하지 않는다.
