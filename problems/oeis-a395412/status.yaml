notes: README header says explicitly this is partial progress, not a solution of the infinite conjecture.
  The proof for each n is an Atkin-Morain ECPP certificate made by PARI/GP 2.19.0 primecert and accepted
  by primecertisvalid; every certificate was also re-checked by verify_witnesses.py, whose elliptic-curve
  check is written independently of PARI (it uses gmpy2 integers locally and pure Python in CI). The full
  certificate set (about 79 MB) is not committed; CI regenerates every candidate from (n, d),
  compares SHA-256 digests, and checks three committed sample certificates (n = 85, 201, 300), so CI
  alone does not re-prove the other rows. Witnesses are the least d passing BPSW, identical to the
  original run for n <= 400. A small structural lemma shows candidates have no prime factor <= p_n;
  refuting the conjecture would additionally require compositeness certificates for every admissible d.
