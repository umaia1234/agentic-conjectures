verify:
- cmd: python3 search_and_certify.py --gp /path/to/gp --prove-through 200 --screen-through 400 --output
    result.json
  expected_runtime: unknown (rigorous APRCL/ECPP proofs dominate; /path/to/gp is a placeholder)
  ci_feasible: false
- cmd: python3 verify_witnesses.py
  expected_runtime: about 20 seconds locally (pure Python, stdlib only; regenerates all 394 candidates
    and checks 3 sample ECPP certificates)
  ci_feasible: true
- cmd: python3 ecpp_certify.py --from 85 --to 478 --jobs 4 --expect ecpp_witnesses.json
  expected_runtime: local only, needs PARI/GP 2.19+; measured about 24400 s of PARI CPU time and about
    2.5 h wall with 4 jobs on a heavily loaded Apple M5 Max (85..400 in 69 min, 401..478 in 81 min)
  ci_feasible: false
  requires: [gp]
- cmd: python3 verify_witnesses.py --cert-dir build/certificates --backend gmpy2 --jobs 4
  expected_runtime: local only, needs gmpy2 and the certificates regenerated by the previous command;
    measured 413 s wall (1331 s CPU) with 4 jobs on Apple M5 Max
  ci_feasible: false
