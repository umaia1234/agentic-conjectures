  scope: source audit, proof, Lean 4 formalization, certificate, and bilingual documentation
notes: >-
  OEIS revision 26 still presented the parity statement as a conjecture when checked on 2026-08-12.
  The proof is a direct reduction to the classical Catalan parity classification, so no novelty or priority
  is claimed; the finite standard-library certificate checks the defining recurrence, all 25 canonical JSON
  terms, and parity through n=600 but does not replace the universal Lean proof. There is no upstream Lean
  snapshot for this directly harvested OEIS problem; the result is unreviewed and has not been submitted externally.
