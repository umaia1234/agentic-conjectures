notes: >-
  The values for 11 ≤ N ≤ 28 are computer-assisted, not Lean-checked. They come from two
  independent C++ programs: a turn-level search whose pruning rules are proved informally in
  DETAILS.md, and a pick-level recursion without pruning that follows the gap recursion derived
  in Lean (gapValue_eq). The two programs agree for every N ≤ 28. Both also agree with a literal
  Python transliteration of valueAux on all positions with R ⊆ {1..12} and D ≤ 12 (CI).
  Lean covers only N ≤ 10, because `decide` evaluates the unmemoized
  recursion in the kernel. The upstream definitions are copied byte for byte (CI-checked); only
  the module header and the namespace differ. The paper reports optimal-play results for N ≤ 20
  and MCTS experiments for N = 23, 24, 27, 28, and A278587 lists N = 3..20. The values for
  N = 21..28 were not found in these sources. The search also covered arXiv, and the seven works
  that cite the paper on OpenAlex were screened by title only. There is no novelty claim, and
  nothing has been submitted to the OEIS or upstream. Conjecture L in
  DETAILS.md is open: it has been tested only in the stated ranges, and its natural two-ply
  inductive invariant fails.
