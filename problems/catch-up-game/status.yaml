verify:
  - cmd: python3 verify_values.py
    expected_runtime: "about 25 s (both C++ solvers for N <= 22, Python for N <= 12, 11,264 positions)"
    ci_feasible: true
  - cmd: python3 verify_values.py --nmax 12 --positions 12
    expected_runtime: "about 7 s (three-way comparison on all 53,248 positions with R ⊆ {1..12}, 0.8 GB)"
    ci_feasible: true
  - cmd: python3 check_upstream_copy.py
    expected_runtime: "<1 s"
    ci_feasible: true
  - cmd: g++ -O3 -std=c++17 closure_check.cpp -o build_closure && ./build_closure 1 16 && rm -f build_closure
    expected_runtime: "about 10 s"
    ci_feasible: true
  - cmd: python3 generalization_check.py 9 7
    expected_runtime: "about 3 s"
    ci_feasible: true
  - cmd: python3 verify_values.py --nmax 28
    expected_runtime: "about 30 min single-threaded; about 15 GB of memory at N = 28"
    ci_feasible: false
  - cmd: python3 generalization_check.py 12 9
    expected_runtime: "about 8 min (497 s, 0.37 GB)"
    ci_feasible: false
