id: catch-up-game
title: "Catch-Up on {1..N} — draw conjecture checked to N = 28"
title_ko: "{1..N} 위의 Catch-Up — 무승부 추측을 N = 28까지 확인"
domain: other
source_url: "https://mpra.ub.uni-muenchen.de/108784/"
claimed_status: partial
claim: >-
  Lean-proves the Catch-Up draw conjecture for N ≤ 10 and that an odd T_N never gives a draw;
  two independent C++ solvers (computer-assisted, not Lean-checked) compute the exact value for
  every N ≤ 28, and every even-T_N case among them is a draw; the general statement is reduced
  to a stronger complete-multiset conjecture that was tested but remains open.
claim_ko: >-
  Catch-Up 무승부 추측을 N ≤ 10에서 Lean으로 증명하고, T_N이 홀수이면 무승부가 나올 수
  없음도 Lean으로 증명한다. 서로 독립적인 두 C++ 탐색기로 모든 N ≤ 28의 정확한 값을
  계산했으며(컴퓨터 보조, Lean 미검사), 그중 T_N이 짝수인 경우는 모두 무승부다. 일반적인
  명제는 더 강한 완비 중복집합 추측으로 환원했지만, 그 추측은 검사만 했을 뿐 미해결이다.
