id: ramsey-r3-10
title: R(3,10) symmetric-subcase exclusions
title_ko: R(3,10)의 대칭 부분 경우 배제
domain: graph-combinatorics
source_url: ''
claimed_status: partial
claim: 'Claims SAT/DRAT-certified exclusions of a few automorphism classes only: no triangle-free 40-vertex
  graph with independence number <= 9 is invariant under a semiregular action of C20, C10xC2, D10, Dic5
  or F20 with two orbits, of C10 or D5 with four orbits, or of C8 or Q8 with five orbits (the four- and
  five-orbit cases use a hand-proved normalisation lemma, and the D5, C8 and Q8 proofs are too large to
  commit and were checked locally); R(3,10) in {40,41} is not determined.'
claim_ko: >-
  몇몇 자기동형 부류만을 SAT/DRAT 인증으로 배제한다. 독립수가 9 이하인 삼각형 없는 40정점
  그래프는 두 궤도로 반정칙 작용하는 C20, C10xC2, D10, Dic5, F20, 네 궤도로 반정칙 작용하는
  C10, D5, 다섯 궤도로 반정칙 작용하는 C8, Q8 가운데 어느 작용 아래에서도 불변일 수 없다(네 궤도와
  다섯 궤도 경우는 손으로 증명한 정규화 보조정리를 쓰며, D5, C8, Q8의 증명은 너무 커서 커밋하지
  않고 로컬에서 검사했다). R(3,10)이 {40,41} 중 어느 값인지는 결정하지 못한다.
