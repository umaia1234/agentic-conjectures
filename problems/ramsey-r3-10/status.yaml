    classes)
notes: Status line reads computationally certified but not peer reviewed; README explicitly makes no literature-novelty
  claim and says the one-orbit circulant exclusion is already implied by published results; four SAT backends
  agree UNSAT and official drat-trim reported s VERIFIED; regenerated certificates need not be byte-identical.
  Full SAT+CEGAR regeneration and cross-solving are local-only. Symmetric classes (symmetric/, added 2026-10-24)
  are checked by a stdlib-only audit that rebuilds each group from its multiplication law, checks group axioms,
  identifying invariants and semiregularity, and writes the exact CNF (not committed; SHA-256 in README); drat-trim
  then checks a CaDiCaL 3.0.1 proof reduced to binary DRAT core lemmas and stored xz-compressed. The four- and
  five-orbit classes add clauses justified by a hand-proved normalisation lemma (single-orbit right translations
  and orbit sorting, README); the audit checks its hypotheses and rebuilds the clauses, but the lemma itself and
  the Cayley-graph and cycle-type corollaries are pen-and-paper. The D5, Q8 and C8 proofs (raw CaDiCaL proofs of
  178-360 MB) are not committed; CI only re-runs their audit with --expect-sha256, and the proof regeneration
  plus drat-trim check (ci_feasible false) was run on one local machine. C5 with eight orbits ran 5.2 h without a
  result and was stopped; C4xC2, C2^3, D4, the order-4 classes and fixed-point-free involutions were not
  attempted.
