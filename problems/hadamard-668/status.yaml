id: hadamard-668
title: Hadamard matrix of order 668
title_ko: 668차 Hadamard 행렬
domain: graph-combinatorics
source_url: https://github.com/google-deepmind/formal-conjectures/blob/9118d083ffca1536f521f9a7d103201f537ea670/FormalConjectures/Wikipedia/Hadamard.lean
claimed_status: partial
claim: 'Computer search, two implementations per class: for 72 of the 80 multiplier subgroups H of (Z/333)^*
  there is no Legendre pair of length 333 (sums 1) with both sequences H-invariant; 8 classes, including
  the unrestricted one, stay open, so nothing is claimed about Hadamard order 668 itself.'
claim_ko: >-
  클래스마다 두 구현으로 수행한 컴퓨터 탐색 결과, (Z/333)^*의 multiplier 부분군 H 80개 중 72개에 대해서는
  두 수열이 모두 H-불변인 길이 333 Legendre pair(합 1)가 존재하지 않는다. 제약 없는 경우를 포함한 8개 부류는
  열려 있으므로 668차 Hadamard 문제 자체에 대해서는 아무것도 주장하지 않는다.
