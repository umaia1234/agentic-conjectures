attribution:
- model: GPT-5.6 Sol
  harness: Codex Desktop
  scope: original research artifacts (proofs, certificates, searches, surveys)
- model: Claude Opus 5.5 (max effort)
  harness: Claude Code
  scope: exhaustive multiplier-subgroup searches for length-333 Legendre pairs (subgroup table, compression
    lists, two independent search implementations per excluded class, positive controls, documentation)
notes: Legendre pairs of length 333 are sufficient, not necessary, for order 668, so every exclusion here concerns
  one construction class only. The 72 excluded classes C(H) require BOTH sequences to be H-invariant (mixed
  pairs reduce to C(H1 ∩ H2)); the trivial group and 7 small subgroups remain open. Exclusions are computer
  results with two independent implementations each and positive controls at lengths 9, 13 and 63; floating-point
  PSD values are used only as a sound pruning filter (tolerance 1e-6, rounding error below 1e-9) and all pair
  conditions are exact. The heavy runs (subgroups <46>, <85>, <175>, <64>) are not CI-feasible; their logs are
  committed and survivor files can be regenerated. No novelty is claimed; the 2026 status report proposes the
  multiplier-orbit route but reports no per-subgroup results, and its kernel order 72 should read 108. The upstream
  Lean statement is sorry-backed.
