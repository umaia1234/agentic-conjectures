notes: >-
  The conjecture is due to Alon Danai, Paul Ellis and Thotsaporn "Aek" Thanatipanonda
  (arXiv:2605.23213v1). Not novel: the refutation confirms the counterexamples X and Y of the
  reply by MathDB user shivampatel (2026-08-20) to post 374893
  (https://mathdb.com/p/374893/version-c-s-subtract-three-conjecture), which MathDB lists as
  claimed solved but unverified;
  this entry adds a kernel-checked Lean proof. The statement is ours (Formal Conjectures has none);
  its choices are listed in the module docstring and DETAILS.md. It assumes n >= 3, which only
  weakens it: read literally, the conjecture also fails at n = 2 for every (2, 3k+2)
  (two_counterexample proves (2,2)), positions the paper's small-piles lemma lists as exceptions.
  The certificates are checked with decide +kernel (no native_decide); CertX and CertY take about
  20 s and 45 s to compile. The robustness counts (failures for n = 9 and 10 even when every
  a_i >= 3) and the Version B check of MathDB post 374892 are computer-assisted only and not
  formalized. No human has reviewed the refutation, and nothing has been submitted externally.
