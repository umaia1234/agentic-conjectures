- path: ../../AgenticConjectures/OooooobVersionC/CertX.lean
  kind: lean-proof
- path: ../../AgenticConjectures/OooooobVersionC/CertY.lean
  kind: lean-proof
- path: DETAILS.md
  kind: mathematical-details
- path: gen_certificate.py
