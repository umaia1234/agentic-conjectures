id: oooooob-version-c
title: OOOOOOB Version C — the subtract-three conjecture refuted by (2,2,2,2,2,2,3)
title_ko: OOOOOOB 버전 C — 3의 배수 추측을 (2,2,2,2,2,2,3)으로 반박
domain: other
source_url: https://arxiv.org/abs/2605.23213v1
claimed_status: refuted
claim: >-
  Lean-refutes Conjecture 3.1 of arXiv:2605.23213v1 (Version C of generalized OOOOOOB), read with
  n >= 3: X = (2,2,2,2,2,2,3) has 63 tokens but is an N-position
  (AgenticConjectures.OooooobVersionC.not_statement), and Y = (2,2,2,2,2,2,4) has 70 tokens but is
  a P-position (AgenticConjectures.OooooobVersionC.not_statement_of_Y). Not novel: both
  counterexamples were posted on MathDB (post 374893, reply by user shivampatel, 2026-08-20).
claim_ko: >-
  arXiv:2605.23213v1의 추측 3.1(일반화된 OOOOOOB의 버전 C)을 n >= 3으로 읽어 Lean에서 반박했다.
  X = (2,2,2,2,2,2,3)은 토큰이 63개이지만 N-위치이고(AgenticConjectures.OooooobVersionC.not_statement),
  Y = (2,2,2,2,2,2,4)는 토큰이 70개이지만
  P-위치이다(AgenticConjectures.OooooobVersionC.not_statement_of_Y). 새 결과가 아니다. 두 반례는
  MathDB(게시물 374893, 사용자 shivampatel의 답글, 2026-08-20)에 이미 공개되었다.
