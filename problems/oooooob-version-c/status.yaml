- path: oooc_counts.cpp
  kind: search-code
- path: oooc_tuples.py
  kind: search-code
verify:
- cmd: g++ -O3 -std=c++17 oooc_counts.cpp -o /tmp/oooc_counts && /tmp/oooc_counts --ci
  expected_runtime: about 1 second after compilation
  ci_feasible: true
  requires: [g++]
- cmd: python3 oooc_tuples.py
  expected_runtime: about 22 seconds
  ci_feasible: true
- cmd: python3 gen_certificate.py --check
  expected_runtime: about 8 seconds
  ci_feasible: true
- cmd: g++ -O3 -std=c++17 oooc_counts.cpp -o /tmp/oooc_counts && /tmp/oooc_counts --version-b
  expected_runtime: under 1 second after compilation (Version B note in DETAILS.md)
  ci_feasible: true
  requires: [g++]
- cmd: python3 oooc_tuples.py --version-b
  expected_runtime: under 1 second (Version B note in DETAILS.md)
  ci_feasible: true
- cmd: python3 oooc_tuples.py --full
  expected_runtime: about 2.5 minutes
  ci_feasible: false
- cmd: g++ -O3 -std=c++17 oooc_counts.cpp -o /tmp/oooc_counts && /tmp/oooc_counts box 9 3 4
  expected_runtime: about 18 seconds; prints 20 failures among 512 positions (robustness table)
  ci_feasible: false
  requires: [g++]
- cmd: g++ -O3 -std=c++17 oooc_counts.cpp -o /tmp/oooc_counts && /tmp/oooc_counts box 10 3 4
  expected_runtime: about 6.5 minutes and 35 GB of memory; prints 593 failures among 1,024 positions
  ci_feasible: false
  requires: [g++]
- cmd: python3 oooc_tuples.py box 9 3 3
  expected_runtime: about 6.5 minutes; prints 1 failure (every a_i = 3 gives an N-position)
  ci_feasible: false
