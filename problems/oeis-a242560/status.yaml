notes: The formal definition uses integer divisibility, makes the PARI program's k>=1 convention explicit,
  and excludes its zero denominator k=N. The formal minimum is unbounded as in the mathematical headline,
  unlike the PARI loop's experimental k<=N! bound; this does not affect the theorems. The closed form
  proves the equality with A060681 asked about in the OEIS entry. Exact checks find one b-file discrepancy
  through N=70, at N=25. Targeted public searches on 2026-08-12 found no earlier proof connecting the
  displayed definition to the closed form, but this is not a novelty claim; the result is unreviewed and
  has not been submitted externally. The conflicting b-file is auto-synthesized from the sequence entry,
  so the inconsistency lives in the entry's main DATA line rather than an independently curated b-file.
