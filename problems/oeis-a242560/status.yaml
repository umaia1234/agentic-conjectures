claim: Lean-verifies a(N)=N-N/minFac(N) for every N>1, hence the OEIS conjecture a(2n)=n; it also shows
  that the official b-file value a(25)=24 disagrees with the displayed definition, which gives 20.
claim_ko: >-
  모든 N>1에 대해 a(N)=N-N/minFac(N)을 Lean으로 검증하여 OEIS 추측 a(2n)=n을 증명했다. 또한
  본문에 제시된 정의로는 a(25)=20이므로 공식 b-file의 값 a(25)=24와 불일치함을 보였다.
