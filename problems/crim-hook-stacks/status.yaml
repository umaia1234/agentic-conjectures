attribution:
- model: Claude Opus 5.5 (max effort)
  harness: Claude Code
  scope: proof of conj:main => conj:bloby and its local form, Lean 4 formalization (including
    Zeng's boundary-word classification), two independent exhaustive solvers, the strategy replay,
    the boundary-word cross-check, and documentation
notes: >-
  The conjectures are from Ina Bašić, Eric Gottlieb and Matjaž Krnc, arXiv:2606.16828. No Formal
  Conjectures statement exists, so both formal statements (statement for conj:bloby,
  mainConjecture for conj:main) are ours; DETAILS.md section 1.1 and the module docstring list every
  reading. The stack is the paper's general definition via the Durfee length, and the hook formula
  is the theorem stack_hook. Rows and columns count as hooks (they are never P), and λ = [] is
  allowed. The rank is |ℓ(λ) − λ1| as in section 2.1 of the paper; only its parity matters. The
  proof of conj:main formalizes the classification and proof in Zijian Zeng's unrefereed preprint
  "A Boundary-Word Classification of Losing Positions in CRIM" (GitHub ArtificialZeng/AI-Has-Taste,
  dated 2026-08-29): the mathematics of that part is Zeng's, the Lean proof is ours, and the
  preprint does not mention conj:bloby. The second-player strategy for conj:main => conj:bloby was
  first sketched, and tested to n <= 40, by an earlier scouting run of this project; the proof here
  completes it. The computations (two independent solvers to sizes 60 and 110, the strategy replay
  to 60, and Zeng's rule against the exact table to 60) are evidence only and are not used by the
  Lean proof. S. S. Mehat's Zenodo artifact 10.5281/zenodo.22070744 states even rank for all
  P-positions with at most six parts or largest part at most six; it is not used here. The
  repository the-omega-institute/trureturing has Lean refutations of two other conjectures of the
  paper (CrimRectairSquareBoundaryRefutation, CrimGrundyRefutation) and nothing on conj:main or
  conj:bloby. thm:3parts of the paper, as stated, includes the column [1,1,1], which is N. No
  human has reviewed this work, no novelty is claimed, and nothing has been submitted externally.
