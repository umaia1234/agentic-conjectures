id: crim-hook-stacks
title: 'CRIM losing-hook stacks (arXiv:2606.16828) — Lean proof of conj:bloby and conj:main'
title_ko: 'CRIM의 지는 훅 쌓기(arXiv:2606.16828) — conj:bloby와 conj:main의 Lean 증명'
domain: other
source_url: https://arxiv.org/abs/2606.16828
claimed_status: proved
claim: >-
  Lean-proves the losing-hook stacking conjecture conj:bloby (statement_holds) and the even-rank
  conjecture conj:main (mainConjecture_holds). conj:main comes from a Lean formalization of the
  boundary-word classification of the P-positions (isP_ofPairs_iff) that Zijian Zeng stated and
  proved in an unrefereed preprint; conj:bloby follows from conj:main by a second-player strategy
  (statement_of_mainConjecture), which also has a local form (isP_stack_of_localEvenRank).
  Exhaustive computation to size 110 and a replay of the strategy to size 60 agree.
claim_ko: >-
  지는 훅 쌓기 추측 conj:bloby(statement_holds)와 짝수 랭크 추측 conj:main(mainConjecture_holds)을
  Lean으로 증명했습니다. conj:main은 Zijian Zeng이 심사 전 프리프린트에서 제시하고 증명한 경계
  단어에 의한 P-위치 분류(isP_ofPairs_iff)를 Lean으로 형식화해 얻었고, conj:bloby는 후수 전략으로
  conj:main에서 이끌어 냈습니다(statement_of_mainConjecture). 이 전략에는 국소형
  (isP_stack_of_localEvenRank)도 있습니다. 크기 110까지의 전수 계산과 크기 60까지의 전략 재현도
  같은 결과를 줍니다.
