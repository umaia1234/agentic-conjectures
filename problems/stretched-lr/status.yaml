verify:
- cmd: python3 lr_tableau_dp.py --self-test
  expected_runtime: under 1 second
  ci_feasible: true
- cmd: python3 exhaustive_search.py --self-test --rows 7 --max-size 10
  expected_runtime: about 5 seconds
  ci_feasible: true
- cmd: g++ -O3 -std=c++17 -shared -fPIC lr_count.cpp -o /tmp/liblrcount_selftest.so && python3 exhaustive_search.py
    --self-test --rows 7 --max-size 10 --library /tmp/liblrcount_selftest.so
  expected_runtime: about 10 seconds including compilation
  ci_feasible: true
- cmd: python3 search_stretched.py --self-test
  expected_runtime: under 1 second (needs the lrcalc Python package)
  ci_feasible: false
- cmd: mkdir -p build && c++ -O2 -std=c++17 -shared -fPIC lr_count.cpp -o build/liblrcount.so && python3
    exhaustive_search.py --library build/liblrcount.so --rows 5 --min-size 1 --max-size 30
  expected_runtime: about 30 minutes (needs lrcalc 2.1 and PyNormaliz 2.24)
  ci_feasible: false
- cmd: mkdir -p build && c++ -O2 -std=c++17 -shared -fPIC lr_count.cpp -o build/liblrcount.so && python3
    exhaustive_search.py --library build/liblrcount.so --rows 7 --min-size 1 --max-size 27
  expected_runtime: about 4.7 hours summed over shards (needs lrcalc 2.1 and PyNormaliz 2.24; split with --shard K --shards N)
  ci_feasible: false
- cmd: mkdir -p build && c++ -O2 -std=c++17 -shared -fPIC lr_count.cpp -o build/liblrcount.so && python3
    exhaustive_search.py --library build/liblrcount.so --rows 6 --min-size 28 --max-size 30
  expected_runtime: about 3.9 hours summed over shards (needs lrcalc 2.1 and PyNormaliz 2.24; split with --shard K --shards N)
  ci_feasible: false
attribution:
- model: GPT-5.6 Sol
  harness: Codex Desktop
  scope: original research artifacts (proofs, certificates, searches, surveys)
- model: Claude Opus 5.5 (max effort)
  harness: Claude Code
  scope: exhaustive sub-box search (exact LR-tableau DP, lrcalc and Normaliz cross-checks, merged summary),
    CI self-tests, and the pip-lrcalc fallback of search_stretched.py
notes: The exhaustive part (2026-10-24) covers B(7, 1..27), B(6, 28..30) and B(5, 1..30) as listed
  in exhaustive_summary.json. Each polynomial rests on two independent exact computations. In regime
  A the DP and lrcalc both supply every interpolation value. In regime B the DP interpolation must equal
  Normaliz's Ehrhart polynomial, and lrcalc spot-checks P(1) and P(2), and in this regime the degree
  comes from Normaliz's dimension, which is checked against a rigorous bound and one extra stretch. The
  full runs need lrcalc 2.1, PyNormaliz and CPU-hours, so CI only re-runs self-tests, which recompute
  B(7, 1..10) in pure Python and match its digests. Only digests and statistics are stored, not the
  individual polynomials. For the older random searches, trials contain duplicates, dimension
  thresholds skip regimes and classic lrcalc has signed 64-bit overflow risk. The problem page still
  listed the problem as unsolved on 2026-08-11. 7-part triples with 28 <= |lambda| <= 30 are not covered.
