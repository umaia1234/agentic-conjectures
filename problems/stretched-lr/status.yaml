id: stretched-lr
title: Stretched Littlewood-Richardson negative-coefficient search
title_ko: 신장된 Littlewood–Richardson 음수 계수 탐색
domain: other
source_url: https://epoch.ai/frontiermath/open-problems/stretched-lr-coefficients
claimed_status: partial
claim: 'Claims only negative searches: for every triple of the FrontierMath box with at most six parts
  and every triple with |lambda| <= 27 (48,992,614 triples with c > 0), the exactly computed stretched
  LR polynomial has no negative (indeed no zero) power-basis coefficient, as in the earlier random and
  stretched-Kostka searches; 7-part triples with 28 <= |lambda| <= 30 remain unchecked.'
claim_ko: >-
  음수 계수를 찾지 못했다는 탐색 결과만 주장한다. FrontierMath 범위에서 부분이 6개 이하인 모든
  삼중항과 |lambda| <= 27인 모든 삼중항(c > 0인 삼중항 48,992,614개)에 대해 신장 LR 다항식을 정확히
  계산했으며, 보통 멱기저 계수 가운데 음수는 없었다(0도 없었다). 이전의 무작위 탐색과
  stretched-Kostka 탐색에서도 음수 계수는 나오지 않았다. 부분이 7개이고 28 <= |lambda| <= 30인
  삼중항은 아직 확인하지 않았다.
