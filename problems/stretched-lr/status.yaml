notes: Header states Status UNKNOWN / negative result of the search, explicitly neither a proof of the
  King-Tollu-Toumazet conjecture nor an exhaustion of the box; random trials contain duplicates and dimension
  thresholds skip regimes; classic lrcalc has signed 64-bit overflow risk, motivating the exact Rust route;
  problem page still listed unsolved on 2026-08-11. Self-tests require a locally extracted liblrcalc,
  so no CI-runnable command.
