notes: 'The canonical A384162 rational generating function and example both give a(2)=6; canonical A342168
  gives A342168(1)=4. The Lean model uses the equivalent generating-function coefficient recurrence and
  published binomial sum, while the standard-library certificate independently enumerates marked words
  and evaluates Chebyshev U. Unreviewed; no novelty is claimed and nothing was submitted to OEIS. The
  published cross-reference is likely a one-digit typo: n*A342167(n-1) matches all published terms; the
  refutation targets the literal published statement and does not depend on that diagnosis.'
