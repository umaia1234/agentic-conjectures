id: oeis-a046969
title: OEIS A046969 — Conjecture I proved via a(p) = 12(2p-1)
title_ko: OEIS A046969 — a(p) = 12(2p-1)로 추측 I 증명
domain: oeis
source_url: https://oeis.org/A046969
claimed_status: proved
claim: Lean-verifies that a(p)=12(2p-1) for every prime p>3 with 2p-1 prime, where a(n) is the denominator
  of B_{2n}/(2n(2n-1)), so a(p)/12=2p-1 is prime and OEIS A046969 Conjecture I holds.
claim_ko: >-
  2p-1도 소수인 모든 소수 p>3에 대해 a(p)=12(2p-1)임을 Lean으로 검증했다. 여기서 a(n)은
  B_{2n}/(2n(2n-1))의 분모이므로 a(p)/12=2p-1은 소수이고, OEIS A046969의 추측 I이 성립한다.
