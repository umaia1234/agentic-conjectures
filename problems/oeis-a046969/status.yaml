notes: The Lean module copies the upstream definition of a verbatim; statement is the universal closure
  of the upstream theorem conjecture1, which is also restated with its exact signature. The natural-number
  subtractions 2*p-1 and m-1 never truncate here, the n=0 branch of a is unused, and a p / 12 is exact
  because a p = 12(2p-1). The proof uses mathlib's von Staudt-Clausen theorem and Faulhaber formula plus
  a doubling (Voronoi, multiplier 2) congruence for power sums modulo l^2; it reproves only the special
  cases of Adams' theorem and Kummer's congruence that it needs, both classical, so no novelty is claimed.
  The Python script is a sanity check only (OEIS DATA terms 1..35 and the 17 qualifying primes below 400).
  Conjecture II of the same entry, refuted upstream at n=236791, is out of scope. Unreviewed; not reported
  to OEIS.
