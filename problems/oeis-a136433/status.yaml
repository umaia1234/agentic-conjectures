notes: OEIS still marked the recurrence as 'Conjecture' as of 2026-08-11; the recurrence formula itself
  has appeared in OEIS LinearRecurrence code since 2013, so the claimed contribution is the universal
  proof, not discovery; unreviewed and not confirmed by OEIS editors; certificate re-checks finitely many
  identities and does not replace the proof; no upstream Lean snapshot in this directory.
