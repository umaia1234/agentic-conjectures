  - AgenticConjectures.OeisA100475.not_isUltimatelyPeriodic
  - AgenticConjectures.OeisA100475.count_prime_pow_ten_lt
attribution:
- model: Claude Opus 5.5 (max effort)
  harness: Claude Code
  scope: refutation proof, Lean 4 formalization with kernel computations, independent Python
    certificate, and documentation
notes: The refutation is complete in Lean; every finite step (pi(10^4)=1229, exact prime counts below
  100112 and 509712, the d<=4 band search) is a decide +kernel evaluation linked to Nat.Prime and Nat.nth
  by proved lemmas, and no step relies on the Python script, which only re-derives the same numbers by
  a sieve. Definitions are copied term for term from the upstream snapshot; the theorem
  not_isUltimatelyPeriodic is stronger than the negated conjecture because it also covers x=1. The
  start x=0, a totalization artifact with constant orbit 0, is excluded by upstream as well. The argument
  is elementary (the OEIS entry already links Rosser's theorem), so no novelty is claimed; unreviewed and
  not reported to OEIS or Formal Conjectures.
