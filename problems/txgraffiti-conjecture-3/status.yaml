  scope: "Lean 4 formalization (G48, the edge bound, the blow-up lemma, the refutations given the
    certified lower bound), CNF generator and DRAT certificate, independent C checker, searches for
    degrees 4 to 6, pen-and-paper class results and documentation"
notes: >-
  Trust split: Lean proves mu*(G48) = 15, the independent dominating set D48 of size 16, the
  bound |E| <= (2r-1) mu*, the blow-up lemma, and not statement / not statementGeFour from the
  hypothesis G48LowerBound (no independent dominating set of G48 has at most 15 vertices).
  G48LowerBound itself rests on a DRAT proof that drat-trim checks in CI, for a CNF that CI
  regenerates from the Lean source and hash-checks; that the CNF encodes G48LowerBound is a
  pen-and-paper argument (g48_cnf.py docstring, DETAILS.md section 3). An independent C branch and
  bound recomputes i(G48) = 16 and mu*(G48) = 15 in CI. The cubic counterexamples are not ours and
  were public before this work: the earliest we found is the 50-vertex graph of
  djma/TxGraffiti-conjecture3-counterexample (2026-07-23, with a CNF and LRAT proof of i >= 16),
  from which Zenodo 10.5281/zenodo.21852504 (2026-08-08) is derived and which Afrasyab
  (arXiv:2609.10783) also studies; Iwane gives 113 more (GitHub 2026-07-27, Zenodo
  10.5281/zenodo.22924244); G48 is the graph of the anonymous ipitchford/txgraffiti-order48-successor
  release (2026-08-24, with a proof-tree certificate of i >= 16); and Formal Conjectures issue #6737
  reports the conjecture false. The refutation for r >= 4 goes only through degrees divisible by 3;
  degrees
  4, 5, 7, 8 and every other r >= 4 not divisible by 3 remain open. The searches are computer-assisted,
  local only and unformalized, and rely on nauty geng. The r >= 7 result for graphs with an efficient
  edge dominating set (a direct corollary of Gupta, arXiv:2608.22498, Theorem 1) and the MU(1)
  remark are pen and paper only. The paper's sharpness clause is not addressed. The definitions are
  copied from formal-conjectures c094b97, but the module is compiled only against this
  repository's pinned mathlib; upstream_statement_check.lean re-elaborates the upstream statement
  over the verbatim upstream definitions and derives its negation from not_statement, but it is
  not imported by the library, so CI does not run it. No novelty is claimed, and no human has
  reviewed these results.
