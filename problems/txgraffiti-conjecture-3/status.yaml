id: txgraffiti-conjecture-3
title: "TxGraffiti Conjecture 3: i(G) <= mu*(G) for regular graphs"
title_ko: "TxGraffiti 추측 3: 정칙 그래프에서 i(G) <= mu*(G)"
domain: graph-combinatorics
source_url: "https://arxiv.org/abs/2507.17780"
claimed_status: refuted
claim: >-
  Refutes the statement and its restriction to degrees r >= 4: Lean proves that the public 48-vertex
  cubic graph G48 has mu* = 15 and, given i(G48) >= 16 (a DRAT certificate checked in CI), that its
  blow-up G48[K2bar] is a 6-regular counterexample on 96 vertices and that every degree divisible by
  3 fails. Degrees r >= 4 not divisible by 3, including 4 and 5, stay open; unformalized searches
  find no counterexample among connected 4-regular graphs on at most 17 vertices or 5-regular graphs
  on at most 14 vertices.
claim_ko: >-
  명제와, 차수를 r >= 4로 제한한 명제를 모두 반증한다. 공개된 48정점 3-정칙 그래프 G48에서
  mu* = 15임을 Lean으로 증명했고, i(G48) >= 16(CI가 검사하는 DRAT 인증서)을 전제로 그 블로업
  G48[K2bar]가 정점 96개인 6-정칙 반례이며 3의 배수인 모든 차수에서 추측이 거짓임도 Lean으로
  증명했다. 4와 5를 포함해 3의 배수가 아닌 차수 r >= 4는 여전히 미해결이다. 형식화되지 않은
  탐색에서 정점 17개 이하의 연결 4-정칙 그래프와 정점 14개 이하의 연결 5-정칙 그래프 가운데
  반례는 나오지 않았다.
