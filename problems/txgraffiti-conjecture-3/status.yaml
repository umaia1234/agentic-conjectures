verify:
- cmd: python3 certificates/g48_cnf.py --check
  expected_runtime: under 1 second (regenerates the CNF from the Lean source and checks its SHA-256)
  ci_feasible: true
- cmd: drat-trim certificates/g48_ids_le15.cnf certificates/g48_ids_le15.drat
  expected_runtime: about 0.1 seconds
  ci_feasible: true
  requires: [drat-trim]
- cmd: "cc -O2 -o /tmp/txgraffiti3_tx3check search/tx3check.c && python3 certificates/g48_cnf.py --g6 | /tmp/txgraffiti3_tx3check | grep -q 'COUNTEREXAMPLE i=16 mu.=15'"
  expected_runtime: about 1 second (independent branch and bound for i(G48) = 16 and mu*(G48) = 15)
  ci_feasible: true
  requires: [cc]
- cmd: sh search/reproduce.sh
  expected_runtime: "about 2.5 hours on one core (default stages); `sh search/reproduce.sh quartic17`
    adds the n = 17 quartic search, about 2 CPU-hours"
  ci_feasible: false
  requires: [cc, geng]
- cmd: cd ../.. && lake env lean problems/txgraffiti-conjecture-3/upstream_statement_check.lean
  expected_runtime: about 10 seconds after lake build
  ci_feasible: false
  requires: [lake]
