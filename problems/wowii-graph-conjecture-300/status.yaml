attribution:
- model: Claude Opus 5.5 (max effort)
  harness: Claude Code
  scope: >-
    Lean 4 statement and formal refutation (the 15-vertex counterexample, the family G_t for every t,
    the 12-vertex graph), the numerical checks, the minimum-order computation, and documentation; the
    15-vertex counterexample was first found by an earlier scouting run of this project
notes: >-
  Not novel: the Kuberwastaken/c5-k4 transcription audit (commit 2448b85, 2026-08-12), made from a live
  fetch of the page, lists 300 as false with the note "July 26 2026 William Weishuhn (CU Boulder),
  family with arbitrarily large violation; Codex-assisted verification". We could not read that note
  (the page is unreachable and its last Wayback capture, 2026-07-26, still shows 300 as open), so we
  cannot compare that family with G_t; we found no earlier formal proof. Formal Conjectures has no
  statement of 300, so the Lean statement is ours. It mirrors their definitions (commit 49ba26b) with
  three differences listed in the module docstring, and it fixes a reading: the bar is the complement
  (in the HTML of every capture, definition 31 linked, as in Conjecture 301 and Theorem 10 of
  DeLaViña-Liu-Pepper-Waller-West 2007), the frequency counts vertices, and the bound is real-valued.
  Without the complement, G_t attains equality; we claim nothing about that reading. That no connected
  graph on at most 11 vertices violates the bound, the lists on 12 to 14 vertices and the minimum
  order 12 are computation, not Lean; they depend on nauty 2.9.3 and on the spanning-tree argument in
  DETAILS.md. No human has reviewed this work, and nothing has been submitted externally.
