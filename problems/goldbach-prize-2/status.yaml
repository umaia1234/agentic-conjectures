notes: >-
  The official €100 page displayed “No solutions received” on 2026-08-12
  and “Solution under review” on 2026-08-13; it identifies neither the
  submitter nor the submitted solution, and review is not acceptance. The
  Lean theorem verifies exact enumeration and zero error. Compliance with
  the informal formula-language condition uses a finite residue table whose
  size depends on the fixed moduli; a stricter parameter-independent syntax
  condition is not formalized. This work is unreviewed, claims no novelty or
  priority, and was not submitted externally.
