id: goldbach-prize-2
title: "Let's Prove Goldbach prize problem 2 — exact periodic formula"
title_ko: "‘골드바흐를 증명하자’ 상금 문제 2 — 정확한 주기 공식"
domain: other
source_url: https://www.dimostriamogoldbach.it/en/prizes/
claimed_status: proved
claim: >-
  Under the per-fixed-triple finite-case interpretation, proves an exact
  periodic residue-list formula for the x-th positive integer divisible by
  none of n1,n2,n3, so the advertised n3^2/2 error bound holds with zero
  error.
claim_ko: >-
  각 고정 삼중항별 유한 경우라는 해석 아래에서 n1,n2,n3 어느 것으로도
  나누어지지 않는 x번째 양의 정수의 정확한 주기 잔여 리스트 공식을
  증명하므로, 게시된 n3^2/2 오차 한계가 오차 0으로 성립한다.
