id: frankl-union-closed
title: Frankl's union-closed sets conjecture
title_ko: Frankl의 합집합 닫힌 집합족 추측
domain: graph-combinatorics
source_url: https://github.com/google-deepmind/formal-conjectures/blob/9118d083ffca1536f521f9a7d103201f537ea670/FormalConjectures/Wikipedia/UnionClosed.lean
claimed_status: partial
claim: >-
  Lean-verifies the classical singleton and two-element-set special cases (Sarvate–Renaud: if {a} is a
  member then a lies in at least half of the members, and if {a,b} is a member then a or b does), the
  averaging lemma, and the conjecture for families whose union has at most 6 elements, all against the
  upstream definitions; the conjecture remains open.
claim_ko: >-
  고전적인 한원소 집합·두원소 집합 특수 경우(Sarvate–Renaud: {a}가 집합족에 속하면 a가 구성원 집합의
  절반 이상에 들어 있고, {a,b}가 속하면 a나 b가 그러하다), 평균 보조정리, 그리고 모든 구성원 집합의
  합집합이 원소 6개 이하인 집합족에 대한 추측을 upstream 정의에 맞춰 Lean으로 검증했다. 추측 자체는
  여전히 미해결이다.
