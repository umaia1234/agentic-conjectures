notes: >-
  Partial result only: the conjecture itself (recorded as the Prop `statement`) is not proved, and nothing
  is said about ground sets of 13 or more elements. Everything in the Lean module is classical and no
  novelty is claimed: the 1-set and 2-set cases are Sarvate–Renaud (1989), the averaging lemma is standard
  double counting, and the union-size <= 6 case is far weaker than the known ground-set <= 12 theorem of
  Vuckovic–Zivkovic. IsUnionClosed is a term-for-term copy of the upstream definition; `statement` binds
  the upstream section variables explicitly (universe-polymorphic via a universe parameter), and all
  theorems use the upstream rational form (1/2 : Q) * #A <= #{x in A | i in x} on Finset (Finset n).
  `singleton_mem` and `univ_card_two` repeat upstream declarations that upstream already proves
  (re-proved here against the copied definition, the latter without `decide`); `univ_card_le_six` is the
  sorry-backed upstream `univ_card` with 12 replaced by 6. The upstream statements union_closed, yu,
  univ_card, family_card and the tightness conjecture remain sorry-backed and are not formalized here;
  the cited Vuckovic–Zivkovic, Yu and Bouchard results are literature, not work done here.
