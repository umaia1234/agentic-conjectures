notes: >-
  The open statement is Formal Conjectures Arxiv.«1601.03081».crystals_components_unique at
  c094b97, still tagged research open; the Lean file copies IsCrystalWithComponents term for term
  and records the theorem as `statement` without proving it. The Lean results are the paper's
  Proposition 1 (also in the open Formal Conjectures PR #7051) and Theorems 4-5 (the paper takes
  Theorem 4 from Abrate-Barbero-Cerruti-Murru, Integers 2015), proved here by Vieta descent, plus the
  reduction to "n determines k" and the cases k = 3, equal k and two j = 1 crystals. The k = 4
  against j = 1 exclusion is computer-assisted: eq_of_crystalK_eq_four_of_j1 proves it in Lean
  from the hypothesis EllipticCurveIntegralPoints (every integral point of y^2 = x^3 - 10x^2 + 24x
  + 16 has x in {0, 3, 4, 6, 10, 16, 19, 84, 1200}), which is not proved in Lean; it relies on PARI
  ellrank (rank 2 by 2-descent), a lower bound for canonical heights from Sage, PARI
  ellsaturation, and Sage's integral_points (passagemath 10.8.13, PARI 2.17.4). The collision searches use the Lean
  classification for completeness; crystal_search.c (C, saturating 128-bit arithmetic, Lucas
  pairs) and crystal_exact.py (exact Python integers, the (u, v) recurrence) share no code and agree
  on every class count and on a checksum of the j >= 2 members up to 2^127 - 1, and
  direct_check.py, which does not use the classification, reproduces them up to 10^14. Beyond
  2^127 - 1 only crystal_exact.py ran (j >= 2 against all classes up to 10^40). No human has
  reviewed this work, no novelty is claimed, and nothing has been submitted externally. The Lean
  file is compiled against mathlib v4.30.0, while Formal Conjectures c094b97 pins v4.33.1.
