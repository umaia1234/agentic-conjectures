verify:
- cmd: python3 direct_check.py 1e12 | grep -v '^seconds' | diff - logs/summary_1e12.txt
  expected_runtime: about 3 seconds
  ci_feasible: true
- cmd: python3 crystal_exact.py 1e12 | grep -v -e '^seconds' -e '^F4 members' | diff - logs/summary_1e12.txt
  expected_runtime: under 1 second
  ci_feasible: true
- cmd: python3 crystal_exact.py 1e34 --f4-limit 1e24 | grep -v -e '^seconds' -e '^F4 members' | diff - logs/summary_1e34.txt
  expected_runtime: about 20 seconds
  ci_feasible: true
- cmd: cc -O2 -o /tmp/crystal_search crystal_search.c -lm -lpthread && /tmp/crystal_search 1e34 2 | grep -v -e '^seconds' -e '^F4 members' | diff - logs/summary_1e34.txt
  expected_runtime: about 4 seconds
  ci_feasible: true
  requires: [cc]
- cmd: python3 direct_check.py 1e14
  expected_runtime: about 35 seconds (output in logs/direct_check.log)
  ci_feasible: false
- cmd: cc -O2 -o /tmp/crystal_search crystal_search.c -lm -lpthread && /tmp/crystal_search max 4
  expected_runtime: about 26 seconds on 4 threads, 1.1 GB (output in logs/crystal_search.log)
  ci_feasible: false
  requires: [cc]
- cmd: python3 crystal_exact.py 2^127-1 --f4-limit 1e30
  expected_runtime: about 3 minutes, 1.9 GB (output in logs/crystal_exact.log)
  ci_feasible: false
- cmd: python3 crystal_exact.py 1e40 --f4-limit 1e30
  expected_runtime: about 6 minutes, 4.3 GB (output in logs/crystal_exact.log)
  ci_feasible: false
- cmd: sage -python ec_k4_j1.py
  expected_runtime: about 2 seconds (or run it with a Python that has passagemath; output in logs/ec_k4_j1.log)
  ci_feasible: false
  requires: [sage]
