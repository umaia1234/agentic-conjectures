id: crystal-components-unique
title: Unique crystal components (arXiv:1601.03081) — Lean classification, cases, search to 2^127
title_ko: 크리스털 성분의 유일성(arXiv:1601.03081) — Lean 분류, 부분 경우, 2^127까지의 탐색
domain: other
source_url: https://arxiv.org/abs/1601.03081
claimed_status: partial
claim: >-
  Lean-proves the paper's classification of crystals (isCrystal_iff_seqU, isCrystal_iff_kpr), that
  the conjecture is equivalent to "n determines k = (a+b)^2/((a+1)(b+1))"
  (statement_iff_crystalK_eq), and the cases k = 3, equal k and two j = 1 crystals
  (eq_of_crystalK_eq_three, eq_of_crystalK_eq, eq_of_j1); with the integral points of an elliptic
  curve, computed in Sage/PARI, as an explicit hypothesis it also proves k = 4 against j = 1
  (eq_of_crystalK_eq_four_of_j1). Two independent searches find no collision among the
  3,493,319,443,273 crystals n <= 2^127 - 1; the case k >= 5, j >= 2 against a different k stays
  open.
claim_ko: >-
  논문의 크리스털 분류(isCrystal_iff_seqU, isCrystal_iff_kpr), 추측이 "n이
  k = (a+b)^2/((a+1)(b+1))를 결정한다"와 동치라는 사실(statement_iff_crystalK_eq), 그리고 k = 3인
  경우, k가 같은 경우, j = 1인 두 크리스털의 경우(eq_of_crystalK_eq_three, eq_of_crystalK_eq,
  eq_of_j1)를 Lean으로 증명했습니다. 또한 Sage/PARI로 계산한 타원곡선의 정수점 목록을 명시적인 가정으로
  두고 k = 4와 j = 1의 경우를 Lean으로 증명했습니다(eq_of_crystalK_eq_four_of_j1). 서로 독립적인 두
  탐색은 n <= 2^127 - 1인 크리스털 3,493,319,443,273개에서 충돌을 찾지 못했습니다. k >= 5, j >= 2인
  크리스털과 k가 다른 크리스털의 경우는 열려 있습니다.
