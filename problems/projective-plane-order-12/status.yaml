id: projective-plane-order-12
title: Finite projective plane of order 12
title_ko: 12차 유한 사영평면
domain: erdos
source_url: https://github.com/google-deepmind/formal-conjectures/blob/9118d083ffca1536f521f9a7d103201f537ea670/FormalConjectures/ErdosProblems/723.lean
claimed_status: partial
claim: 'Claims only certified reproductions of classical exclusions, not the existence question: there is
  no (157,13,1) difference set in Z_157 (no cyclic plane of order 12) and no (13,11,12,1) relative difference
  set in Z_143 (no cyclic affine plane of order 12), each by two independent exhaustive searches and a DRAT-checked
  SAT refutation, and Lean proves that a collineation of prime order p >= 13 has p = 13 with a unique fixed
  antiflag or p = 157 with no fixed point or line.'
claim_ko: >-
  존재 문제가 아니라 고전적 배제 결과의 인증된 재현만 주장한다. Z_157에는 (157,13,1) difference set이
  없고(order 12인 순환 plane 없음) Z_143에는 (13,11,12,1) relative difference set이 없음(order 12인
  순환 affine plane 없음)을 각각 서로 독립인 두 전수 탐색과 DRAT로 검사한 SAT 반박으로 확인했으며,
  위수가 소수 p >= 13인 collineation은 p = 13이고 고정 antiflag가 유일하거나 p = 157이고 고정점과
  고정 직선이 없음을 Lean으로 증명했다.
artifacts:
- path: upstream/723.lean
  kind: upstream-lean
- path: upstream/README.md
  kind: other
- path: ds_enumerate.cpp
  kind: search-code
- path: ds_search_normalized.cpp
  kind: search-code
- path: crosscheck_ab.py
  kind: certificate-script
- path: verify_difference_sets.py
  kind: certificate-script
- path: ds_cnf.py
  kind: search-code
- path: audit_ds_cnf.py
  kind: certificate-script
- path: rds143_core.cnf
  kind: sat-cnf
- path: rds143_core.drat
  kind: sat-drat
- path: make_rds143_certificate.sh
  kind: certificate-script
- path: antiflag_cnf.py
  kind: search-code
- path: antiflag_decode.py
  kind: certificate-script
- path: ../../AgenticConjectures/ProjectivePlaneOrder12.lean
