verify:
- cmd: python3 verify_difference_sets.py controls
  expected_runtime: about 11 s (prime-power and order 6, 10 controls, methods A and B; includes g++ build)
  ci_feasible: true
- cmd: python3 verify_difference_sets.py affine
  expected_runtime: about 10 s (Z_143, methods A and B)
  ci_feasible: true
- cmd: python3 verify_difference_sets.py planar
  expected_runtime: about 25 s (Z_157, method B)
  ci_feasible: true
- cmd: python3 audit_ds_cnf.py 143 12 13 6 rds143_core.cnf
  expected_runtime: under 1 s (stdlib-only semantic audit of 36,827 clauses)
  ci_feasible: true
- cmd: drat-trim rds143_core.cnf rds143_core.drat
  expected_runtime: about 2 s (20,213 lemmas)
  ci_feasible: true
  requires:
  - drat-trim
- cmd: python3 verify_difference_sets.py planar-full
  expected_runtime: 15-25 min (Z_157, method A count profile)
  ci_feasible: false
- cmd: mkdir -p build && python3 ds_cnf.py 157 13 157 build/pds157.cnf 5 && python3 audit_ds_cnf.py 157 13 157
    5 build/pds157.cnf && { cadical -q build/pds157.cnf build/pds157.drat; test $? -eq 20; } && drat-trim
    build/pds157.cnf build/pds157.drat
  expected_runtime: about 16 min (CaDiCaL 5 min, drat-trim 11 min; writes a 320 MB proof to build/)
  ci_feasible: false
  requires:
  - cadical
  - drat-trim
lean:
  modules:
  - AgenticConjectures.ProjectivePlaneOrder12
  theorems:
  - AgenticConjectures.ProjectivePlaneOrder12.order13_fixed_antiflag
  - AgenticConjectures.ProjectivePlaneOrder12.prime_gt_13
attribution:
- model: GPT-5.6 Sol
  harness: Codex Desktop
  scope: original research artifacts (proofs, certificates, searches, surveys)
- model: Claude Opus 5.5 (max effort)
  harness: Claude Code
  scope: certified reproductions of the cyclic and cyclic-affine exclusions (two exhaustive searches each, SAT
    with DRAT), Lean fixed-point lemmas for collineations of prime order >= 13, and an order-13 SAT reduction
    left unresolved
notes: Nothing about the existence of a plane of order 12 is claimed; status partial refers only to certified
  reproductions of classical results (Singer, Hall, Evans-Mann, Bose, Hoffman; Gordon 1994), obtained without
  the multiplier theorem. The normalisations (translation and dilation to 0, 1 in D and the least-ratio normal
  form) are justified in the README, and the clause audit re-derives every SAT clause independently of the
  generator. CI re-runs method B for Z_157, methods A and B for Z_143, the controls, and the Z_143 DRAT certificate
  (a drat-trim core of the full formula plus a trimmed proof); the Z_157 SAT proof (320 MB) and method A's full
  Z_157 profile are local-only. The Lean theorems are conditional statements about a hypothetical plane, and
  Singer's correspondence between regular cyclic groups and difference sets is not formalized. The order-13
  SAT instance was stopped after 3.8 h without an answer and nothing is claimed for it. The survey part still
  cites the 2023 exclusion of collineation groups of order 4 (possible group orders 1, 2, 3) and a 2026 source
  listing 12 as the smallest unresolved order; the upstream Erdos problem 723 declaration remains sorry-marked.
