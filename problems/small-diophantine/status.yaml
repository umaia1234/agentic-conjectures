id: small-diophantine
title: Small Diophantine equations low-degree ansatz attempt
domain: other
source_url: https://epoch.ai/frontiermath/open-problems/small-diophantine
claimed_status: partial
claim: 'Claims only exact negative results: three low-degree rational-curve ansatz classes and a narrow
  integer-Q Pell-factor spot-check admit no solutions for the six remaining equations z^2 + y^2*z + x^3
  + a*x + b = 0, none of which is claimed solved.'
artifacts:
