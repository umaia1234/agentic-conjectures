verify:
- cmd: python3 verify_small.py
  expected_runtime: ~5 s (Apple M5 Max); compiles wowii61.cpp, labeled n <= 7 with brute-force crosscheck, Python
    reference on labeled n <= 6, re-checks the committed results/ summaries
  ci_feasible: true
  requires: [g++]
- cmd: bash run_exhaustive.sh /tmp/wowii61-out conn 3 && diff /tmp/wowii61-out/connected_n1-10.txt
    results/connected_n1-10.txt
  expected_runtime: ~45 s wall with 3 jobs (70 s CPU); all connected graphs n <= 10 with brute-force crosscheck
  ci_feasible: false
  requires: [geng, g++]
- cmd: bash run_exhaustive.sh /tmp/wowii61-out conn11 3 && diff /tmp/wowii61-out/connected_n11.txt results/connected_n11.txt
  expected_runtime: ~15 min wall with 3 jobs (27 min CPU) for the 1006700565 connected graphs on 11 vertices
  ci_feasible: false
  requires: [geng, g++]
- cmd: bash run_exhaustive.sh /tmp/wowii61-out trees 2 && diff /tmp/wowii61-out/trees_n1-26.txt results/trees_n1-26.txt
  expected_runtime: ~26 min wall with 2 jobs (30 min CPU) for the 447672596 trees with n <= 26
  ci_feasible: false
  requires: [gentreeg, g++]
- cmd: bash run_exhaustive.sh /tmp/wowii61-out sparse 3 && diff /tmp/wowii61-out/sparse.txt results/sparse.txt
  expected_runtime: ~37 min wall with 3 jobs (73 min CPU) for the 626942607 sparse connected graphs with n = 12..20
  ci_feasible: false
  requires: [geng, g++]
- cmd: bash run_exhaustive.sh /tmp/wowii61-out diampath 3 && diff /tmp/wowii61-out/diampath_n12-18.txt
    results/diampath_n12-18.txt
  expected_runtime: ~30 s wall with 3 jobs; needs the conn and conn11 outputs (generator validation against geng
    for n <= 11)
  ci_feasible: false
  requires: [shortg, g++]
- cmd: bash run_exhaustive.sh /tmp/wowii61-out ref 1
  expected_runtime: ~21 min wall with 1 job (11 min CPU); needs the conn and conn11 outputs; set PYTHON to a python3
    with networkx to add the networkx cross-check
  ci_feasible: false
  requires: [geng, g++]
lean:
  modules:
  - AgenticConjectures.WowiiGraphConjecture61
  theorems:
  - AgenticConjectures.WowiiGraphConjecture61.card_le_largestInducedForestSize
  - AgenticConjectures.WowiiGraphConjecture61.isAcyclic_induce_insert
  - AgenticConjectures.WowiiGraphConjecture61.indepNum_add_one_le_largestInducedForestSize
attribution:
- model: GPT-5.6 Sol
  harness: Codex Desktop
  scope: original research artifacts (proofs, certificates, searches, surveys)
- model: Claude Opus 5.5 (max effort)
  harness: Claude Code
  scope: exhaustive computer check (C++ checker, Python/networkx reference, nauty runs, diametral-path generator,
    CI check) and Lean proof of inequality (5)
notes: 'r(G) is the Havel-Hakimi residue (SimpleGraph.residue), not the radius. The computer check is a finite
  negative search, not a proof: it covers only the listed families, and its completeness relies on nauty (geng,
  gentreeg, shortg), with counts matching OEIS A001349 and A000055; the sparse-family counts are not compared
  with an independent source. The large runs are local; CI re-runs the labeled n <= 7 enumeration with the
  brute-force crosscheck and the Python reference on labeled n <= 6, and re-reads the committed summaries.
  The minimum slack f - r - ceil(D/3) is 0 at every order (stars, K_n) and is 0, 1, 2, 2 at the residual
  diameters 4, 7, 8, >= 10 within the families. The stronger inequality f >= alpha + ceil(D/3) fails at
  diameters 4, 7, 8 and 10-14 in the data, so those diameters need more about r than r <= alpha. The Lean
  module proves only inequality (5), with a local copy of the upstream largestInducedForestSize body; Theorems
  1, 3, 4 and implication (6) stay informal and rely on r(G) <= alpha(G) from the literature. The upstream
  FormalConjectures declaration remains sorry-marked and research open.'
