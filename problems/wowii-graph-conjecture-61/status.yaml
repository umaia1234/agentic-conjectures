id: wowii-graph-conjecture-61
title: WOWII Graph Conjecture 61 partial results
title_ko: WOWII 그래프 추측 61의 부분 결과
domain: graph-combinatorics
source_url: http://cms.dt.uh.edu/faculty/delavinae/research/wowII/
claimed_status: partial
claim: 'Claims informal proofs of partial results (f(G) >= alpha(G) + ceil(D(G)/4); f(G) >= alpha(G)+1,
  also proved in Lean, with f = alpha+1 forcing D(G) <= 4; the original conjecture f(G) >= r(G) + ceil(D(G)/3)
  for diameters {0,1,2,3,5,6,9} and for all trees) and an exhaustive two-implementation computer check
  finding no counterexample among all connected graphs with n <= 11 vertices, all trees with n <= 26,
  connected graphs of cyclomatic number <= 4, 3, 2 with n = 12-15, 16-17, 18-20, and connected graphs
  with diameter D >= n-5 and n = 12-18.'
claim_ko: >-
  부분 결과의 비형식적 증명과 두 구현으로 한 전수 컴퓨터 검증을 주장한다. 증명한 것은 f(G) >= alpha(G) +
  ceil(D(G)/4), f(G) >= alpha(G)+1(Lean으로도 증명)과 f = alpha+1이면 D(G) <= 4라는 귀결, 그리고 지름이
  {0,1,2,3,5,6,9}인 연결 그래프와 모든 트리에서의 원래 추측 f(G) >= r(G) + ceil(D(G)/3)이다. 전수 검증에서는
  n <= 11인 모든 연결 그래프, n <= 26인 모든 트리, n = 12-15, 16-17, 18-20에서 순환 차수가 각각 4, 3, 2
  이하인 연결 그래프, n = 12-18에서 지름 D >= n-5인 연결 그래프 중에 반례가 없었다.
