notes: The k=0 column is classical — McGarvey's conjecture on Schenker sums
  A063170, proved by Amdeberhan-Callan-Moll (Integers 13 (2013), A21), with
  later p-adic work by Miska — so the contribution is the uniform-in-k proof
  of the Jul 2026 triangle conjecture, whose OEIS entry recorded no proof as
  of 2026-08-12; unreviewed, no novelty claimed, nothing submitted upstream;
  the Python certificate re-checks finitely many instances (n <= 220) and the
  published 91 DATA terms, and does not replace the Lean proof; the excluded
  class k == 14 (mod 16) carries only the proved lower bound v2 >= 4, matching
  the OEIS "no simple formula" remark.
