id: oeis-a398189
title: OEIS A398189 — 2-adic valuation of generalized Schenker sums, all four
  conjectured cases proved
domain: oeis
source_url: https://oeis.org/A398189
claimed_status: proved
claim: Proves all four cases of Luschny's conjectured valuation formula for
  A398189(n,k) = v2(A398187(n,k)), A398187(n,k) = Sum_{j<=n-k} ((n-k)!/j!)*n^j
  — v2((n-k)!) for even n; 1 for odd n, k=0; 0 for odd n, odd k; v2(k+2) for
  odd n, even k with k not == 14 (mod 16) — in Lean 4, plus v2 >= 4 in the
  excluded class k == 14 (mod 16).
artifacts:
- path: PROOF.md
  kind: informal-proof
