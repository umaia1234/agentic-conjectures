verify:
- cmd: python3 symmetric/srg_sym_audit.py
  expected_runtime: about 25 seconds (group data and CNF hashes of all 25 cases)
  ci_feasible: true
- cmd: python3 symmetric/verify_certificates.py
  expected_runtime: about 15 seconds (11 core proofs on their clause cores)
  ci_feasible: true
  requires:
  - drat-trim
- cmd: python3 symmetric/validate_encoder.py --semantic-only
  expected_runtime: about 1 second
  ci_feasible: true
- cmd: python3 symmetric/verify_certificates.py --full
  expected_runtime: about 95 seconds (the same proofs against the full CNFs)
  ci_feasible: false
  requires:
  - drat-trim
- cmd: python3 symmetric/validate_encoder.py
  expected_runtime: about 15 minutes (14 of them for the srg(243,22,1,2) solve)
  ci_feasible: false
  requires:
  - cadical
- cmd: python3 symmetric/certify_case.py p2-d0-e2 --build /tmp/conway99-build --out /tmp/conway99-build
    --limit 5400
  expected_runtime: about 65 minutes (CaDiCaL 18 min, then drat-trim 24 min and 21 min)
  ci_feasible: false
  requires:
  - cadical
  - drat-trim
  - xz
attribution:
- model: GPT-5.6 Sol
  harness: Codex Desktop
  scope: original research artifacts (proofs, certificates, searches, surveys)
- model: Claude Opus 5.5 (max effort)
  harness: Claude Code
  scope: symmetric-subcase SAT encoding, independent CNF audit, encoder validation, DRAT-certified exclusion
    of involutions with 11 or more fixed points (and a locally verified type with 9), and reproduction
    runs of known prime-order exclusions
notes: >-
  Symmetric subcases only; existence stays open. CI re-derives every CNF from the group data with
  srg_sym_audit.py, which does not import the encoder, compares SHA-256 hashes, and re-checks the
  eleven committed core proofs (ten involution types and p3-root-a) with drat-trim on their recorded
  clause cores, which are subsets of the CNFs. The soundness of the encoding rests on the
  specification in README.md and on validate_encoder.py (assignments read off Paley(9), Petersen,
  Clebsch, Shrikhande and the Berlekamp-van Lint-Seidel srg(243,22,1,2) satisfy the CNFs; SAT/UNSAT
  matches the known automorphisms for every cycle type of five small srgs); it is not formalized in
  Lean. Eight of the ten CI-checked involution types (F >= 19) also follow from the interlacing bound
  F <= 18 derived in README.md. Type (0,2) with F = 9 is UNSAT by a 549 MB DRAT proof that drat-trim
  verified locally; the proof and its 105 MB core are not committed, cases.json records their hashes,
  and certify_case.py regenerates them. Reproductions of known prime-order exclusions: p3-root-a is
  certified; p11-free, p7-root, p5-root and p3-root-b were UNKNOWN after 1800 s. The other eight
  involution types and fixed-point-free order 3 were UNKNOWN after 600-1800 s. The full texts of
  Behbahani-Lam 2011, Makhnev-Minakova 2004 and Wilbrink 1984 were not consulted, so the excluded types
  may already be known; no novelty is claimed. The 2026-08-11 status survey is kept, and the upstream
  Lean statement is sorry-backed.
