id: conway-99-graph
title: Conway's 99-graph problem srg(99,14,1,2)
title_ko: Conway의 99-그래프 문제 srg(99,14,1,2)
domain: graph-combinatorics
source_url: https://github.com/google-deepmind/formal-conjectures/blob/9118d083ffca1536f521f9a7d103201f537ea670/FormalConjectures/Wikipedia/Conway99Graph.lean
claimed_status: partial
claim: 'Symmetric subcases only, SAT/DRAT-certified: a putative srg(99,14,1,2) has no involution fixing
  11 or more vertices (ten local types, drat-trim re-checked in CI), so every involution fixes 1, 3, 5,
  7 or 9 vertices; local type (0,2) with 9 fixed vertices is also UNSAT, but its proof was verified only
  locally and is too large to commit. Existence remains open.'
claim_ko: >-
  대칭 부분 경우만 SAT/DRAT으로 인증한다. 가상의 srg(99,14,1,2)에는 정점을 11개 이상 고정하는
  involution이 없으므로(열 가지 국소 유형, CI에서 drat-trim으로 재검사) 모든 involution은 정점을
  1, 3, 5, 7, 9개 고정한다. 고정점이 9개인 국소 유형 (0,2)도 UNSAT이지만, 그 증명은 로컬에서만
  검증했고 너무 커서 커밋하지 않았다. 존재 여부는 여전히 미해결이다.
