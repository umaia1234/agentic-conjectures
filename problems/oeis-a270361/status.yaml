id: oeis-a270361
title: OEIS A270361 — uniqueness of the smaller prime
domain: oeis
source_url: https://oeis.org/A270361
claimed_status: proved
claim: 'Lean-proves the OEIS conjecture that for each odd prime p, at most one odd prime q<p can make
  p*q-1 a square, using the two square roots modulo p, their strict bounds, and a parity contradiction.'
artifacts:
- path: README.md
  kind: proof-notes
lean:
  modules:
