  scope: problem selection, proof, Lean 4 formalization, source-faithfulness audit, and documentation
notes: OEIS revision 38 still marked the statement as a conjecture when checked on 2026-08-12; the exported
  Lean statement uses the literal equation p*q-1=m^2, while a proved conversion supplies the internal
  subtraction-safe form p*q=m^2+1; OEIS A000089 records the standard two-root fact underlying the argument,
  so no novelty or priority is claimed; unreviewed and not submitted externally.
