id: min-modulus-multiset-sum
title: "Fonollosa's Conjecture 1 — minimum modulus for unique multiset sums"
title_ko: "Fonollosa 추측 1 — 유일 중복집합 합 문제의 최소 법"
domain: other
source_url: "https://arxiv.org/abs/2607.08366"
claimed_status: partial
claim: >-
  Lean-proves that every valid n-subset of ZMod N has N >= 2^(n-1)+n-2 and N >= n(n-1), hence
  Conjecture 1 for n <= 4; two independent exhaustive searches confirm Conjecture 1 for n <= 9 and
  find that at N = 2^n-2^floor(log2 n) the valid n-sets form the single affine orbit of {2^k-1},
  while the conjecture remains open for n >= 10.
claim_ko: >-
  Lean으로 ZMod N의 모든 유효한 n-부분집합이 N >= 2^(n-1)+n-2와 N >= n(n-1)을 만족함을 증명하여
  n <= 4에서 추측 1을 얻었다. 서로 독립적인 두 전수 탐색은 n <= 9에서 추측 1을 확인하고,
  N = 2^n-2^floor(log2 n)에서 유효한 n-집합이 {2^k-1}의 아핀 궤도 하나뿐임을 보인다.
  n >= 10에서는 추측이 여전히 미해결이다.
