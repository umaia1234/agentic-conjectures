verify:
- cmd: python3 verify_search.py
  expected_runtime: "about 4 s (all committed logs; recomputation for n<=7; brute force for n<=5)"
  ci_feasible: true
  requires: [g++, gcc]
- cmd: python3 verify_search.py --recompute 8 --no-brute
  expected_runtime: "about 1 min (53 s locally)"
  ci_feasible: false
  requires: [g++, gcc]
- cmd: python3 verify_search.py --recompute 9 --threads 3 --no-brute
  expected_runtime: "about 6 single-thread hours (1.8 h mmsearch + 4.4 h mmcheck); roughly 2 h wall with 3 threads"
  ci_feasible: false
  requires: [g++, gcc]
lean:
  modules:
  - AgenticConjectures.MinModulusMultisetSum
  theorems:
  - AgenticConjectures.MinModulusMultisetSum.IsValidMod.two_pow_le
  - AgenticConjectures.MinModulusMultisetSum.IsValidMod.card_mul_card_sub_one_le
  - AgenticConjectures.MinModulusMultisetSum.IsValidMod.two_pow_add_le
  - AgenticConjectures.MinModulusMultisetSum.statement_of_le_four
attribution:
- model: "Claude Opus 5.5 (max effort)"
  harness: "Claude Code"
  scope: >-
    problem setup and prior-art check; Lean 4 lower bounds and the cases n <= 4; two exhaustive
    search implementations, brute-force cross-check and n <= 9 runs; documentation
notes: >-
  Partial result only: Conjecture 1 is open for n >= 10, and the Lean bounds are far below the
  conjectured 2^n-2^floor(log2 n). The bound N >= 2^(n-1) is M. Inal's theorem (OSF preprint,
  July 2026) specialized to cyclic groups; the paper's own CP-SAT certificates cover n <= 7, so the
  new exhaustive range is n = 8, 9. The n = 8, 9 claims rest on two independently written C/C++
  searches that agree on every modulus, plus brute force for n <= 5; CI re-runs n <= 7 and re-checks
  the committed n = 8, 9 logs without recomputing them. The search reduction is proved in DETAILS.md
  but not formalized. No novelty or priority is claimed; nothing has been reported to the author or
  submitted upstream.
