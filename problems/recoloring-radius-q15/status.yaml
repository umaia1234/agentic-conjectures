id: recoloring-radius-q15
title: Graph recoloring radius — subdivided-claw counterexample
title_ko: 그래프 재색칠 반지름 — 세분된 클로 반례
domain: graph-combinatorics
source_url: https://doi.org/10.37236/13788
claimed_status: refuted
claim: >-
  The 7-vertex subdivided claw refutes Question 15 at k=4: C_4(G) and C_5(G)
  are connected, but exact exhaustive computations give radii 9 and 10.
claim_ko: >-
  꼭짓점 7개의 세분된 클로는 k=4에서 질문 15를 반박한다. C_4(G)와 C_5(G)는
  모두 연결이지만, 정확한 완전 탐색으로 얻은 두 반지름은 각각 9와 10이다.
