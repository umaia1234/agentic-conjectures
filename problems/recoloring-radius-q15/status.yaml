notes: >-
  This is a complete counterexample, not a bounded-search inference. The fixed
  witness is graph6 FCOf?, the tree obtained by subdividing every edge of K_1,3
  once. Independent C++ and standard-library Python implementations enumerate
  every labelled proper colouring and verify connectedness and exact radii.
  The earlier k=3 atlas audit is retained as a separately verified search result.
  No publication-priority or novelty claim is made before external review.
