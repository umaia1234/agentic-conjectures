attribution:
- model: GPT-5.6 Sol
  harness: Codex Desktop
  scope: original research artifacts (proofs, certificates, searches, surveys)
- model: Claude Opus 5.5 (max effort)
  harness: Claude Code
  scope: >-
    Lean 4 structural theorems (mod-3 obstruction, counting bounds, infinite families), the two
    independent exact sieves and factorable-count program through 10^10, the verifier, and documentation
notes: >-
  Partial result only: positive density is neither proved nor refuted, and the increasing ratios
  A(N)/N are numerical evidence, not a proof. The Lean bounds sqrt(N)/4 <= A(N) <= 2N/3 are elementary
  and far from deciding the question. The module copies the upstream definitions verbatim but does not
  restate erdos_424, because Set.HasPosDensity lives in FormalConjecturesForMathlib; the counting function
  uses n <= N. The ascending sieve and the generation-by-generation evaluation share only the output format
  and the bitset hash; both match a literal Python transcription of the upstream recursion up to 10^5. CI
  re-verifies through 10^9; the 10^10 run needs about 2.5 GB and minutes, so it is not CI-feasible. The
  mod-3 obstruction and the 2^k+1 family are elementary and likely known; no literature search beyond the
  upstream references was done, and no novelty is claimed.
