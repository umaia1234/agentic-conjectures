  - AgenticConjectures.Erdos424.pow_two_add_one_mem
  - AgenticConjectures.Erdos424.generatedSet_infinite
  - AgenticConjectures.Erdos424.le_sixteen_mul_countingFn_sq
  - AgenticConjectures.Erdos424.not_mem_of_prime_succ
  - AgenticConjectures.Erdos424.three_mul_prime_sub_one_not_mem
