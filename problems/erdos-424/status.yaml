id: erdos-424
title: 'Erdős #424 — mod-3 obstruction, √N/4 ≤ A(N) ≤ 2N/3, exact counts to 10^10'
title_ko: 'Erdős #424 — mod 3 장애물, √N/4 ≤ A(N) ≤ 2N/3, 10^10까지의 정확한 개수'
domain: erdos
source_url: https://github.com/google-deepmind/formal-conjectures/blob/9118d083ffca1536f521f9a7d103201f537ea670/FormalConjectures/ErdosProblems/424.lean
claimed_status: partial
claim: >-
  Lean-proves that the generated set misses the class 1 mod 3 (so A(N) <= 2N/3), that A(N) >= sqrt(N)/4,
  and that both other classes mod 3 contain infinitely many non-members; two independent exact sieves
  give A(10^10) = 5,473,663,856 (ratio 0.5474, still rising), while positive density remains open.
claim_ko: >-
  생성 집합이 mod 3에서 1인 잉여류와 만나지 않으므로 A(N) <= 2N/3이고, A(N) >= sqrt(N)/4이며, 나머지 두
  잉여류 각각에 비원소가 무한히 많음을 Lean으로 증명했다. 서로 독립적인 두 정확한 체로
  A(10^10) = 5,473,663,856(비율 0.5474, 계속 증가 중)을 얻었으나, 양의 밀도 문제는 여전히 미해결이다.
artifacts:
- path: DETAILS.md
  kind: mathematical-details
- path: ../../AgenticConjectures/Erdos424.lean
  kind: lean-proof
- path: verify_counts.py
