- path: erdos424_ascending.cpp
  kind: search-code
- path: erdos424_generations.cpp
  kind: search-code
- path: erdos424_factorable.cpp
  kind: search-code
- path: counts_result.json
  kind: data
- path: erdos424_probe.cpp
  kind: search-code
- path: upstream/README.md
  kind: upstream-lean
verify:
- cmd: python3 verify_counts.py --part sieves
  expected_runtime: about 30 s (N = 10^9, 0.25 GB)
  ci_feasible: true
  requires: [g++]
- cmd: python3 verify_counts.py --part factorable
  expected_runtime: about 20 s (N = 10^9, 0.13 GB)
  ci_feasible: true
  requires: [g++]
- cmd: python3 verify_counts.py --limit 10000000000
  expected_runtime: about 12 min (N = 10^10, 2.5 GB RAM)
  ci_feasible: false
  requires: [g++]
- cmd: g++ -O3 -std=c++17 erdos424_probe.cpp -o build_probe && ./build_probe 1000000 500 && rm -f build_probe
  expected_runtime: about 1-2 s after compilation
  ci_feasible: true
