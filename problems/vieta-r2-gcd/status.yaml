id: vieta-r2-gcd
title: Vieta jumping with r = 2 — the values of 2(a+b)/gcd(a,b)^2
title_ko: r = 2인 Vieta jumping — 2(a+b)/gcd(a,b)^2의 값
domain: other
source_url: https://arxiv.org/abs/2605.19083v2
claimed_status: proved
claim: >-
  Lean-proves Conjecture 4.2 of Miller, Nikolakopoulos and Srinivasan (arXiv:2605.19083v2) as
  AgenticConjectures.VietaR2Gcd.statement_holds: for positive integers a, b and an integer k with
  (a+2)/b + (b+2)/a = k, the value 2(a+b)/gcd(a,b)^2 lies in {1,2,3,4,5,8}, and the values for k = 3, 4, 6
  are exactly {1,5}, {2,3}, {4,8}; for every r > 0 the same module proves 3 <= k <= 2r+2 (GeneralR.k_range),
  descent to finitely many reduced solutions (GeneralR.descent, GeneralR.reduced_bounds), two-periodicity of
  r(a+b)/gcd(a,b)^2 along Vieta chains (GeneralR.two_periodic, GeneralR.values_eq) and the value sets for
  r = 1, 2, 3 (GeneralR.values_one, GeneralR.values_two, GeneralR.values_three).
claim_ko: >-
  Miller, Nikolakopoulos, Srinivasan의 Conjecture 4.2(arXiv:2605.19083v2)를
  AgenticConjectures.VietaR2Gcd.statement_holds로 Lean에서 증명한다. 양의 정수 a, b와 정수 k가
  (a+2)/b + (b+2)/a = k를 만족하면 2(a+b)/gcd(a,b)^2는 {1,2,3,4,5,8}에 속하고, k = 3, 4, 6일 때의 값은
  정확히 {1,5}, {2,3}, {4,8}이다. 같은 모듈은 모든 r > 0에 대해 3 <= k <= 2r+2(GeneralR.k_range), 유한 개의
  기약해로의 강하(GeneralR.descent, GeneralR.reduced_bounds), Vieta 사슬을 따른 r(a+b)/gcd(a,b)^2의 주기
  2(GeneralR.two_periodic, GeneralR.values_eq), r = 1, 2, 3의 값 집합(GeneralR.values_one,
  GeneralR.values_two, GeneralR.values_three)도 증명한다.
