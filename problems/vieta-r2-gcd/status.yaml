notes: >-
  The owner chose to publish this entry with full credit to the paper's authors: the problem, the r = 1
  results, the r = 2 descent to k in {3,4,6} (Remark 4.1), the general-r diagonal analysis and Conjecture 4.2
  itself (in §4.1 of v2) are theirs; DETAILS.md#credit lists the split. No Formal Conjectures statement
  exists, so the Lean statement is ours. It reads k as an integer, as in the paper's setup (with rational k,
  (a,b) = (1,2) gives the value 6); reads "the values are" as set equality, proving both inclusion and
  attainment; computes both fractions and 2(a+b)/gcd(a,b)^2 in Q with Nat.gcd; and takes a, b positive. The C
  and Python programs are supporting evidence only; the Lean proof uses no computation. The value tables for
  4 <= r <= 40 are computational (the Lean theorem values_eq applied to reduced solutions found by the
  program). They show that the values for k = 3 are not {1,5} for every r: at r = 11 they are {1,5,11,55},
  and GeneralR.eleven_three proves that 11 occurs. The write-up is unreviewed, nothing has been reported to
  the authors, and no novelty is claimed.
