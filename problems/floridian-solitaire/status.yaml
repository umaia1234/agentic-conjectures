id: floridian-solitaire
title: Floridian solitaire — immediate losses for every n > 6
title_ko: Floridian solitaire — 모든 n > 6에서의 즉시 패배
domain: other
source_url: https://arxiv.org/abs/2608.08313
claimed_status: proved
claim: Lean-proves that every integer n > 6 has a Floridian-solitaire immediate-loss position, by the paper's odd and 3m+1 families, a gap-two block construction, and explicit witnesses for 18 and 20.
claim_ko: >-
  모든 정수 n > 6에 Floridian solitaire의 즉시 패배 국면이 존재함을 Lean으로 증명했다.
  논문의 홀수 구성과 3m+1 구성, 간격 2 블록, 그리고 18과 20의 명시적 국면을 사용한다.
artifacts:
- path: PROOF.md
  kind: informal-proof
- path: INDEPENDENT_PROOF.md
  kind: informal-proof
- path: verify.py
  kind: certificate-script
- path: verify_independent.py
  kind: certificate-script
verify:
- cmd: python3 verify.py
  expected_runtime: unknown (recorded run checked n=7..500, 334,670 selection profiles)
  ci_feasible: true
- cmd: python3 verify_independent.py
  expected_runtime: unknown
  ci_feasible: true
lean:
  modules:
  - AgenticConjectures.FloridianSolitaire
  theorems:
  - AgenticConjectures.FloridianSolitaire.omega_separated_iff
  - AgenticConjectures.FloridianSolitaire.odd_immediateLoss
  - AgenticConjectures.FloridianSolitaire.oneAndThrees_immediateLoss
  - AgenticConjectures.FloridianSolitaire.exception18_immediateLoss
  - AgenticConjectures.FloridianSolitaire.exception20_immediateLoss
  - AgenticConjectures.FloridianSolitaire.block_immediateLoss
  - AgenticConjectures.FloridianSolitaire.exists_immediateLoss
attribution:
- model: GPT-5.6 Sol
  harness: Codex Desktop
  scope: original research artifacts (proofs, certificates, searches, surveys)
- model: Grok 4.7
  harness: Cursor
  scope: Lean 4 formalization of the immediate-loss theorem
notes: The immediate-loss theorem is kernel-checked in AgenticConjectures/FloridianSolitaire.lean.
  The paper's Lemma 7 is formalized only for partitions with at least two parts; the singleton
  partition (1) contains a part of size p=1 while Ω(1)=(1) is separated, so the unrestricted
  wording fails there. Every partition of an integer n>1 to which the equivalence is applied has
  at least two parts. The result is unreviewed, no novelty or priority is claimed, and nothing
  has been submitted externally. The Python checkers still only re-verify witnesses through a
  finite range and do not replace the Lean proof.
