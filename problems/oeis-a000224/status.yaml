notes: >-
  The even-n, prime-power, and two-distinct-prime cases are kernel-checked in
  AgenticConjectures/OeisA000224.lean against the exact upstream residue-count definition and
  Nat.ModEq congruence; together they give the upstream equivalence for every n>1 with Omega(n)<=2
  and the counterexample shape (odd, not a prime power, Omega(n)>=3). The count of squares modulo
  p^e is proved from the definition (squaring is 2-to-1 on units, and squares divisible by p are p^2
  times the squares modulo p^(e-2)); multiplicativity of A000224 is proved via the Chinese remainder
  theorem. The odd-exponent prime-power step follows the gcd argument of DETAILS.md section 4, not the
  interval comparison in README.md. The last step of the two-prime case is a kernel-evaluated `decide`
  over the 1950 pairs (a,c) with 2<=a<=31, 1<=c<4a, which needs no primality test;
  semiprime_certificate.py remains as an independent script check. General p^e q^f with Omega(n)>=3
  and the cases with >=3 distinct primes are unproved; Pell-seed completeness relies on SymPy's
  diop_DN; OEIS records verification to 10^8; the full upstream Lean conjecture remains sorry-backed.
