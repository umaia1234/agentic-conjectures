id: oeis-a000224
title: OEIS A000224 — R(n)(R(n)-1) divides n^2-1 iff n is an odd prime
title_ko: OEIS A000224 — R(n)(R(n)-1)이 n^2-1을 나눌 필요충분조건은 n이 홀수 소수인 것이다
domain: oeis
source_url: https://oeis.org/A000224
claimed_status: partial
claim: Lean-verifies the upstream equivalence for every n>1 that is even, a prime power, or a product of
  two distinct primes, so any counterexample is odd, not a prime power, and has Omega(n)>=3; a Pell-orbit
  scan covers all K<=375, n<=10^18 with omega(n)<=3, but the full conjecture remains unresolved.
claim_ko: >-
  짝수이거나 소수거듭제곱이거나 서로 다른 두 소수의 곱인 모든 n>1에서 상류 동치가 성립함을 Lean으로
  검증했다. 따라서 반례가 있다면 홀수이고 소수거듭제곱이 아니며 Omega(n)>=3이다. Pell 궤도 탐색은
  K<=375, n<=10^18, omega(n)<=3을 모두 만족하는 모든 경우를 다루었지만, 전체 추측은 여전히
  미해결이다.
