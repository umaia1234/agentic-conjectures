id: oeis-a076141
title: OEIS A076141 — n occurs at most once in binary of n^2, checked to 2^100; a(n) ≤ 2 proved
title_ko: OEIS A076141 — n의 이진 표현은 n^2의 이진 표현에서 최대 한 번 등장, 2^100까지 확인; a(n) ≤ 2 증명
domain: oeis
source_url: https://oeis.org/A076141
claimed_status: partial
claim: >-
  Exact exhaustive searches found no counterexample for 0 < n < 2^100 (earlier pair-geometry search
  n < 2^40), with two independent single-occurrence enumerators agreeing on every occurrence at every
  bit position for n < 2^64 and at the positions left open by Lean-checked pair lemmas up to 2^100, and
  the same Lean lemmas prove the unconditional bound a(n) ≤ 2 for every n; a rigorous bounded
  verification plus a weaker bound, not a proof of the full conjecture.
claim_ko: >-
  정확한 완전탐색으로 0 < n < 2^100에서 반례가 없음을 확인했고(이전 쌍 기하 탐색은 n < 2^40), 독립적인
  두 단일 출현 열거기가 n < 2^64에서는 모든 비트 위치의 출현에 대해, 2^100까지는 Lean으로 검증한 쌍
  보조정리가 남겨 둔 위치의 출현에 대해 완전히 일치했으며, 같은 Lean 보조정리로 모든 n에 대해
  무조건적인 상계 a(n) ≤ 2를 증명했으나, 이는 엄밀한 유한 범위 검증과 더 약한 상계일 뿐 전체 추측의
  증명은 아니다.
