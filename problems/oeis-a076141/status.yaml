notes: The searches give finite statements only. n < 2^64 follows from exhaustive enumeration at every bit position and uses no
  pair lemma; 2^64 <= n < 2^100 additionally relies on the Lean-checked reduction
  (AgenticConjectures.OeisA076141.a_le_one_of_search), which leaves only the positions searched in reduced
  mode. Lean also proves the unconditional bound a(n) ≤ 2 for every n
  (AgenticConjectures.OeisA076141.a_le_two) from the pair lemmas alone, using no search output. The
  completeness of the two single-occurrence methods and the programs themselves are not formalized;
  the two independently written enumerators print identical per-L lines (including candidate counts) and
  identical occurrence lists, and a brute-force scan of all odd n < 2^34 agrees with both. The large runs
  are local-only; their logs with SHA-256 hashes of the occurrence lists are committed. The 2^40 pair-geometry
  run and its audit are unchanged; its periodic audit program uses x86 BMI2 intrinsics and was not rerun on
  arm64. No novelty or priority claim without external review; the upstream Lean universal statement is
  sorry-backed.
