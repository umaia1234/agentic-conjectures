id: oeis-a197702
title: OEIS A197702 — exact least length for signed odd sums
title_ko: OEIS A197702 — 홀수 부호합의 정확한 최소 길이
domain: oeis
source_url: https://oeis.org/A197702
claimed_status: proved
claim: >-
  Lean-proves the complete conjectured formula for the least k such that n is
  a signed sum of 1,3,...,2k-1: in the square interval (k-1)^2<n<=k^2, the
  answer is k+2 when k^2-n=4, k+1 when that gap is odd, and k otherwise.
claim_ko: >-
  n이 1,3,...,2k-1의 부호합이 되는 최소 k의 추측 공식을 Lean으로 완전히
  증명했다. (k-1)^2<n<=k^2에서 k^2-n=4이면 답은 k+2, 그 차이가
  홀수이면 k+1, 그 밖에는 k이다.
