notes: >-
  The conjectures are from Ina Bašić, Eric Gottlieb and Matjaž Krnc, arXiv:2606.16828, section 5.
  No Formal Conjectures statement exists, so both formal statements (meldConjecture,
  pselfConjecture) are ours; DETAILS.md section 1.1 and the module docstring list every reading.
  A meld of losing thick hooks is any member of the closure of the losing thick hooks under the
  binary meld, so every bracketing, a single piece and the empty meld [] (which is P) are
  included; melds_iff shows this is the set of right-nested melds of finite lists. Thick hooks use
  the paper's conditions r > a >= 2 and c > b >= 2. Parity self-conjugacy compares lambda_k and
  lambda'_k for every k >= 1 (both 0 past the end); comparing only k <= min(length, lambda_1)
  makes conj:pself false at [3]. Odd self-conjugate hooks are the hooks Gamma_{r,r} with r odd.
  The stack is the paper's general Durfee-length stack (crim-hook-stacks), nested to the right
  with [1] last and every intermediate stack defined, j >= 0; the paper writes such stacks without
  brackets and calls the operation associative, and pselfConjecture_anyBracketing proves
  conj:pself for every bracketing (stack_hook_assoc, exists_hookTree_iff). Allowing all
  Gamma_{r,r} fails at [2,2]; dropping [1] fails at [3,1,1]. Both proofs are corollaries of the
  classification in Zijian Zeng's unrefereed preprint "A Boundary-Word Classification of Losing
  Positions in CRIM" (GitHub ArtificialZeng/AI-Has-Taste, dated 2026-08-29), formalized as
  isP_ofPairs_iff in crim-hook-stacks; the preprint does not mention these two conjectures. An
  earlier scouting run of this project found both routes and the misère hypothesis and wrote a Lean
  draft of the meld argument for right-nested melds; the module reuses its definitions (meld,
  thickHook, ThickParams, thickPairs) and meld_ofPairs. The misère classification (misereP_iff,
  misereP_iff_isP) is that run's hypothesis, proved here by reusing the move analysis of Zeng's
  proof with three cases changed; misère play makes [] an N-position (the player to move cannot
  move, and wins), and no prior statement of the classification was found. The program also
  checks it to size 50. conj:hookswap (Conway pair (0, 1) iff even-by-even hook) is stated for
  nonempty partitions as hookswapConjecture, because the paper's own cp([]) = (0, 1) makes the
  literal statement fail at [] (nil_conwayPair; an edge case of the wording, not a refutation).
  It is not proved: conwayPair_of_eeHook proves the (<=) direction, which follows from the
  paper's thm:cgpairshooks, via misere_hook; hookswapConjecture_iff reduces the conjecture to
  (=>); and covered_of_conwayPair shows that Conway pair (0, 1) forces L + R >= k with k even.
  The program confirms the nonempty statement to size 50, and OpenConjecture (3663) and MathDB
  (375373) list it as open. The computations are not used by the Lean proofs. S. S. Mehat's Zenodo
  artifact 10.5281/zenodo.22070744 classifies the P-positions with at most six parts and is not
  used here; the repository the-omega-institute/trureturing has Lean refutations of two other
  conjectures of the paper and, on these two, only an open issue (#8292) registering a bounded
  counterexample search for the meld conjecture that evaluated no case. No human has reviewed
  this work, no novelty is claimed, and nothing has been submitted externally.
