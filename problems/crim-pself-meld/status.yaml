id: crim-pself-meld
title: 'CRIM melds of losing thick hooks, parity self-conjugate partitions and misère play (arXiv:2606.16828) — Lean proofs of the meld conjecture, conj:pself and a misère classification'
title_ko: 'CRIM의 지는 두꺼운 훅 멜드, 홀짝 자기켤레 분할, 미제르 규칙(arXiv:2606.16828) — 멜드 추측, conj:pself, 미제르 분류의 Lean 증명'
domain: other
source_url: https://arxiv.org/abs/2606.16828
claimed_status: proved
claim: >-
  Lean-proves the thick-hook meld conjecture (meldConjecture_holds: every meld of losing thick
  hooks, in any bracketing, is a P-position) and conj:pself (pselfConjecture_holds: a parity
  self-conjugate partition is in N iff it is a stack of odd self-conjugate hooks and [1], with the
  stronger form paritySelfConj_and_not_isP_iff, and pselfConjecture_anyBracketing for every
  bracketing of the stack). Both are corollaries of the boundary-word classification of the
  P-positions that Zijian Zeng stated and proved in an unrefereed preprint, formalized in
  crim-hook-stacks (isP_ofPairs_iff). It also Lean-proves a classification of the misère
  P-positions (misereP_iff_isP: a partition is a misère P-position iff exactly one of "it is a
  normal-play P-position" and "L + R >= k" holds), for which no prior statement was found.
  Exhaustive computation to size 50 agrees.
claim_ko: >-
  두꺼운 훅 멜드 추측(meldConjecture_holds: 지는 두꺼운 훅들의 멜드는 괄호 묶는 방식에 관계없이
  P-위치)과 conj:pself(pselfConjecture_holds: 홀짝 자기켤레 분할이 N에 속할 필요충분조건은 홀수
  자기켤레 훅들과 [1]의 스택인 것이며, 더 강한 형태는 paritySelfConj_and_not_isP_iff, 스택의 모든
  괄호 묶기에 대한 형태는 pselfConjecture_anyBracketing)를 Lean으로 증명했습니다. 두 결과 모두
  Zijian Zeng이 심사 전 프리프린트에서 제시하고 증명한 경계 단어에 의한 P-위치 분류의
  따름정리이며, 이 분류는 crim-hook-stacks에서 형식화되었습니다(isP_ofPairs_iff). 또한 미제르
  P-위치의 분류(misereP_iff_isP: 분할이 미제르 P-위치일 필요충분조건은 "정상 규칙의 P-위치이다"와
  "L + R >= k" 중 정확히 하나가 성립하는 것)를 Lean으로 증명했으며, 이 분류의 이전 진술은 찾지
  못했습니다. 크기 50까지의 전수 계산도 같은 결과를 줍니다.
