notes: >-
  Northshield's 2010 Theorem 4.1 supplies the generalized recurrence, and three of the displayed
  identities are immediate consequences of its odd branch; it does not state the A033638
  quarter-square formula, whose additional recurrence proof is formalized here. The pending
  Formal Conjectures PR #4450 omits that formula and leaves its three subclaims open. Targeted
  searches found no earlier proof of the closed form, but this is not a novelty claim. The result
  is unreviewed and has not been submitted externally. The Python check is finite transcription
  evidence only; Lean proves the universal result.
