notes: >-
  The Lean statement copies the upstream definition of a and the conjecture term for term (same
  open Nat Finset Rat; only the module scaffolding and metadata attributes differ), and harmonic is the
  same mathlib definition at upstream's pinned revision. The proof is self-contained in Lean. Ten exact
  harmonic numbers (n up to 68) are evaluated by norm_num, the sanity values a(6)=3 and a(66)=27 use
  decide +kernel, and v3(lcm(1..n)) comes from mathlib's Nat.factorization_lcmUpto. The key lemma
  {n : v3(H_n) > 0} = {2, 7, 22} reproduces Eswarathasan-Levine (1991). The Python certificate is only
  a numerical cross-check (n <= 30000 by default, 300000 optionally). It agrees with the 90 OEIS DATA
  terms, and a development run matched all 10000 b-file terms. Prior art was checked only on OEIS. The
  result is unreviewed, no novelty is claimed, and nothing was submitted to OEIS. The refutation leaves
  open which odd numbers do occur (for example, whether 35 does).
