id: oeis-a110566
title: OEIS A110566 — "every odd number occurs" refuted (81 never occurs)
title_ko: OEIS A110566 — "모든 홀수가 나타난다" 추측 반박 (81은 나타나지 않음)
domain: oeis
source_url: https://oeis.org/A110566
claimed_status: refuted
claim: 'Refutes the conjecture that every odd number occurs in a(n) = lcm(1..n)/den(H_n): Lean 4 proves
  v3(a(n)) <= 3 for every n, so 81, like every odd multiple of 81, is never a term.'
claim_ko: >-
  a(n) = lcm(1..n)/den(H_n)에 모든 홀수가 나타난다는 추측을 반박했다. 모든 n에 대해
  v3(a(n)) <= 3임을 Lean 4로 증명했으므로, 81은 81의 다른 홀수 배수와 마찬가지로 이 수열의 항이
  되지 않는다.
