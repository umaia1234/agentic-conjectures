id: oeis-a135508
title: OEIS A135508 — McEachen's conjecture a(p-1) = p (criterion and partial results)
title_ko: OEIS A135508 — McEachen 추측 a(p-1) = p (판정 기준과 부분 결과)
domain: oeis
source_url: https://oeis.org/A135508
claimed_status: partial
claim: Lean-verifies, against the upstream definitions, that for primes p >= 5 a(p-1) = p iff
  gcd(x(p-3), p-2) > 1, and that a(p-1) = p for every prime p >= 7 with p = 2 mod 3 or mod 5 and for
  every prime p with p-2 composite with least prime factor below 1009 (all primes p < 1018083
  included); two independent scans check the conjecture for all primes p <= 10^9+1, but the full
  conjecture remains open.
claim_ko: >-
  상류 정의 그대로, 소수 p >= 5에서 a(p-1) = p와 gcd(x(p-3), p-2) > 1이 동치임을 Lean으로
  검증했다. 또 p가 3 또는 5를 법으로 2와 합동인 모든 소수 p >= 7과, p-2가 1009 미만의 최소
  소인수를 갖는 합성수인 모든 소수 p(1018083 미만의 모든 소수 포함)에서 a(p-1) = p임을 Lean으로
  검증했다. 독립적인 두 탐색이 p <= 10^9+1인 모든 소수에서 추측을 확인했지만, 추측 전체는
  미해결이다.
