attribution:
- model: Claude Opus 5.5 (max effort)
  harness: Claude Code
  scope: criterion, residue-class and least-prime-factor theorems with a kernel-checked certificate
    (AgenticConjectures.OeisA135508), conditional reductions, two independent scans to 10^9, the
    standard-library check script, and the documentation
notes: The full conjecture is not proved; `statement` is stated but not derived, and the two
  conditional reductions assume unproved hypotheses (every prime r divides x(r^2-1); a(n) is 1 or
  prime). The Lean module copies the upstream x and a term for term; for n >= 1 the natural division
  is exact and the truncated subtraction inactive (a_eq). The certificate that every prime r < 1009
  divides x(r^2-1) is evaluated by the kernel with decide +kernel (largest instance x(42611)); no
  native_decide. Everything about primes beyond 1018083 whose p-2 has no prime factor below 1009 is
  script-checked only - the 10^9 scans (C++ and numba, written separately, identical fingerprints) and
  the r <= 31622 extension of the certificate - and relies on the Lean-proved identities a_eq and
  x_succ_eq; the C++ exponent cap of 255 is harmless because every exponent in n+1 <= 4e9 is at most
  31. The density figures (5/8, about 0.89 and 0.93) follow from Dirichlet's theorem and are not
  formalized. The criterion and the mod-3/mod-5 classes were found in the harvest triage; Schepke's
  2009 thesis already gives the quotient formula and the experimental observations. Attempts in the
  OEIS Open benchmark on the full statement were all scored I. No novelty is claimed and nothing was
  reported to OEIS or Formal Conjectures.
