notes: The definitions a and ratExpression are term-for-term copies of the upstream file; statement is the
  upstream conjecture with n > 3 under the quantifier and is NOT proved. The prime direction is equivalent
  to sum_{k<p} 2^k/k == -2 q_p(2) (mod p^2) for the Fermat quotient q_p(2) and follows from Wolstenholme's
  theorem; it is classical, and no novelty is claimed. The composite families come from the leading q-adic
  terms of E_n; they cover no odd prime power q^k (k >= 2), and up to 2*10^6 they miss only 1027 and 55225
  among the other composites. Method B and the C++ program share the q-adic method; method A (exact
  integers) is algorithmically independent of both. CI reruns 3<n<=10^4 (literal, A, B) and 3<n<=10^5
  (C++ against A); the 2*10^6 run is local only. Nothing has been reported to OEIS or upstream.
