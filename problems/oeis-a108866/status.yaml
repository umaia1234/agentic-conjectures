id: oeis-a108866
title: OEIS A108866 — Ordowski's prime criterion, prime direction and composite families
title_ko: OEIS A108866 — Ordowski의 소수 판정 추측, 소수 방향과 합성수 족
domain: oeis
source_url: https://oeis.org/A108866
claimed_status: partial
claim: Lean-verifies that p^2 divides the numerator of -2/p + sum_{k=1}^p 2^k/k for every prime p>3 (a
  short classical argument), and that n^2 does not divide the numerator for every even n, every multiple
  of 3 other than a power of 3, and two leading-digit families; two independent programs check the
  composite direction for 3<n<=2*10^6, but the conjecture remains open (no odd prime power is covered).
claim_ko: >-
  모든 소수 p>3에 대해 -2/p + sum_{k=1}^p 2^k/k의 분자가 p^2으로 나누어떨어짐(짧은 고전적
  논증)과, 모든 짝수 n, 3의 거듭제곱이 아닌 모든 3의 배수, 두 가지 최고 자릿수 족에서는 분자가
  n^2으로 나누어떨어지지 않음을 Lean으로 검증했다. 합성수 방향은 3<n<=2*10^6에서 독립적인 두
  프로그램으로 확인했지만, 홀수 소수 거듭제곱은 하나도 다루지 못하므로 추측은 여전히 미해결이다.
