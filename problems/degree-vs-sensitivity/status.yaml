verify:
- cmd: python3 degree_sensitivity_pair_bound.py
  expected_runtime: unknown
  ci_feasible: true
- cmd: python3 degree_sensitivity_symmetric.py
  expected_runtime: about 3 s (stdlib only; counting exclusions plus 16 committed Farkas trees)
  ci_feasible: true
- cmd: python3 degree_sensitivity_symmetric_search.py --group 'C7(7^2)' --out /tmp/dvs_c7_7x2.json
    && python3 degree_sensitivity_symmetric_search.py --group D13 --out /tmp/dvs_d13.json && python3
    degree_sensitivity_symmetric_search.py --group trivial --n 10 --degree 4 --out /tmp/dvs_n10_d4.json
    && python3 degree_sensitivity_symmetric.py --skip-counting /tmp/dvs_c7_7x2.json /tmp/dvs_d13.json
    /tmp/dvs_n10_d4.json
  expected_runtime: about 40 min single-threaded (needs numpy and highspy for the search; the check is
    stdlib only and takes seconds)
  ci_feasible: false
- cmd: mkdir -p /tmp/dvs_young4 && for p in 9,3,1,1 8,4,1,1 9,2,2,1 7,5,1,1 6,6,1,1 8,3,2,1 7,4,2,1
    8,2,2,2 6,5,2,1 7,3,3,1 6,4,3,1 5,5,3,1 7,3,2,2 5,4,4,1 6,4,2,2 5,5,2,2 6,3,3,2 5,4,3,2 4,4,4,2 5,3,3,3
    4,4,3,3; do python3 degree_sensitivity_symmetric_search.py --group "young:$p" --out "/tmp/dvs_young4/young_$(echo
    "$p" | tr , _).json" || exit 1; done && python3 degree_sensitivity_symmetric.py --young-blocks 4 /tmp/dvs_young4/*.json
  expected_runtime: about 10 min single-threaded plus 30 s of checking (needs numpy and highspy; writes 89 MB)
  ci_feasible: false
attribution:
- model: GPT-5.6 Sol
  harness: Codex Desktop
  scope: original research artifacts (proofs, certificates, searches, surveys)
- model: Claude Opus 5.5 (max effort)
  harness: Claude Code
  scope: symmetric-subclass exclusions for n=14 degree<=5 (orbit reduction, counting and integer
    Farkas-tree certificates with a stdlib checker, Young subgroups with at most four blocks) and the
    n=10 degree<=4 exclusion
notes: README stresses the full-search outcome is UNKNOWN (timeout only, no evidence either way), that
  no nonexistence proof was obtained, and that the necessary conditions are not claimed to be new to the
  literature; intermediate symmetry branches were not exhausted. Heavy CP-SAT/MILP searches (ortools)
  are local-only. Symmetric-subclass exclusions are certificates (integer Farkas multipliers at the
  leaves of a 0/1 branching tree, rechecked from row keys by a stdlib checker); HiGHS floating point
  only proposes them. The C7(7^2), D13, D7-diagonal, n=10 degree-4 and four-block Young certificates
  (0.3-17 MB each) are not committed; README gives regeneration commands and the SHA256 of the checked
  files. CI checks counting exclusions and the 16 committed certificates (three-block Young claim). C13 and C11 were
  not decided, and the sensitivity<=9 corollary for degree 4 may already be known.
