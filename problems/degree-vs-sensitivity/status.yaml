id: degree-vs-sensitivity
title: Degree vs sensitivity — n=14 degree-5 aggregate constraints and symmetric exclusions
title_ko: 차수와 민감도 — n=14, 차수 5의 층별 총계 제약과 대칭 부분류 배제
domain: other
source_url: https://epoch.ai/frontiermath/open-problems/degree-sensitivity-boolean
claimed_status: partial
claim: Claims exact layer constraints (B_2>=84, exactly 247 feasible (B_2,B_3,B_4,B_5) profiles) for
  the n=14 degree<=5 fully sensitive case and exact Farkas-tree/counting exclusions of every solution
  invariant under a permutation of cycle type 7^2 (hence any 14-cycle), under C13:C3 or D13, or under
  any Young subgroup with at most four blocks, plus that no degree<=4 function on 10 variables is fully
  sensitive (so degree 4 cannot beat the exponent); the full n=14 search remains UNKNOWN.
claim_ko: >-
  n=14이고 차수가 5 이하인 모든 변수에 민감한 함수의 경우, 정확한 층별 필요조건(B_2>=84, 가능한
  (B_2,B_3,B_4,B_5) 프로파일이 정확히 247개)을 보이고, 순환 구조가 7^2인 치환(따라서 모든
  14-순환), C13:C3 또는 D13, 또는 블록이 네 개 이하인 Young 부분군 아래 불변인 해를
  정확한 Farkas 트리와 개수 세기 인증서로 배제한다. 또한 10변수에서 차수 4 이하이면서 모든 변수에
  민감한 함수가 없으므로 차수 4로는 지수를 개선할 수 없다. n=14 전체 탐색은 여전히 UNKNOWN이다.
