name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml sympy
      - name: Build drat-trim (DRUP/DRAT proof checker)
        run: |
          git clone --depth 1 https://github.com/marijnheule/drat-trim /tmp/drat-trim
          make -C /tmp/drat-trim drat-trim
          echo /tmp/drat-trim >> "$GITHUB_PATH"
      - name: Generated documentation freshness
        run: |
          python3 scripts/gen_readme.py --check
          python3 scripts/gen_upstream_docs.py --check
      - name: Documentation links and companions
        run: python3 scripts/check_docs.py
      - name: Re-run CI-feasible certificates
        run: python3 scripts/verify_all.py --ci

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache mathlib build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/mathlib
          key: mathlib-cache-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
      - name: Fetch mathlib build cache
        run: lake exe cache get
      - name: Static gates (imports reachable, no sorry/axiom/native_decide)
        run: |
          python3 scripts/check_imports.py
          python3 scripts/check_sorry.py
      - name: Build library
        run: lake build
      - name: Axiom audit (#print axioms per declared theorem)
        run: python3 scripts/check_axioms.py

  # Publish-only jobs below: they run after BOTH verification jobs are green
  # on main, so the public dashboard and the weekly release can never get
  # ahead of what CI actually re-verified.
  pages:
    if: github.event_name != 'pull_request'
    needs: [certificates, lean]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Generate the static dashboard
        run: python3 scripts/gen_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.event_name != 'pull_request'
    needs: [certificates, lean]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Decide whether this run refreshes the weekly release
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- docs/highlights.yaml | grep -q .; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update the weekly release
        if: steps.gate.outputs.refresh == 'true'
        run: |
          python3 scripts/gen_release_notes.py build/release
          tag=$(cat build/release/tag.txt)
          title=$(cat build/release/title.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file build/release/notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$title" \
              --notes-file build/release/notes.md --generate-notes
          fi
